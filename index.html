<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目索引</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36;
    --fg:#e6e9ef; --dim:#8b93a5; --accent:#6ea8fe;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f8fa;--panel:#fff;--line:#e3e6ec;--fg:#1b1f27;--dim:#6b7280;--accent:#2563eb}
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:36px 20px 96px}

  header{position:sticky;top:0;z-index:5;background:var(--bg);
         padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:28px}
  h1{margin:0 0 14px;font-size:20px;font-weight:600;letter-spacing:.02em}
  h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}

  .search{position:relative}
  .search input{
    width:100%;padding:11px 40px 11px 14px;font-size:15px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);outline:none;transition:border-color .15s;
  }
  .search input:focus{border-color:var(--accent)}
  .search kbd{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font:11px/1 ui-monospace,monospace;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:3px 6px;
  }
  .search input:not(:placeholder-shown) + kbd{display:none}

  .section{margin-bottom:38px}
  .section h2{
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin:0 0 12px;display:flex;align-items:center;gap:10px;
  }
  .section h2::after{content:"";flex:1;height:1px;background:var(--line)}

  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;
     grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  a.card{
    display:block;padding:13px 15px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);
    color:inherit;text-decoration:none;
    transition:border-color .15s,transform .1s;
  }
  a.card:hover{border-color:var(--accent)}
  a.card:active{transform:scale(.99)}
  .card .name{font-weight:500}
  .card .name::after{content:"↗";float:right;color:var(--dim);font-size:13px;opacity:0}
  a.card:hover .name::after{opacity:1}

  mark{background:transparent;color:var(--accent);font-weight:600}
  .empty{color:var(--dim);text-align:center;padding:60px 0;display:none}
  .error{color:#e5534b;text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>项目索引<small id="count"></small></h1>
    <div class="search">
      <input id="q" type="search" placeholder="搜索名称或分类…" autocomplete="off">
      <kbd>/</kbd>
    </div>
  </header>

  <main id="app"></main>
  <p class="empty" id="empty">没有匹配的项目</p>
</div>

<!-- ① 数据文件：以后添加项目只改这个 -->
<script src="data.js"></script>

<!-- ② 渲染逻辑：一般不用动 -->
<script>
(function () {
  const app   = document.getElementById("app");
  const input = document.getElementById("q");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  if (typeof DATA === "undefined" || !Array.isArray(DATA)) {
    app.innerHTML = '<p class="error">未加载到 data.js，或 DATA 数据格式有误。</p>';
    return;
  }

  const BASE = (typeof BASE_PATH === "string") ? BASE_PATH : "";
  const all  = DATA.flatMap(s => (s.items || []).map(it => ({ ...it, group: s.group })));

  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function mark(text, kw) {
    text = text == null ? "" : String(text);
    if (!kw) return esc(text);
    const i = text.toLowerCase().indexOf(kw);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i))
         + "<mark>" + esc(text.slice(i, i + kw.length)) + "</mark>"
         + esc(text.slice(i + kw.length));
  }

  function render() {
    const kw = input.value.trim().toLowerCase();
    let html = "", shown = 0;

    for (const section of DATA) {
      const hits = (section.items || []).filter(it =>
        !kw
        || (it.name || "").toLowerCase().includes(kw)
        || (section.group || "").toLowerCase().includes(kw)
      );
      if (!hits.length) continue;
      shown += hits.length;

      html += `<section class="section">
        <h2>${esc(section.group)}</h2>
        <ul>${hits.map(it => `
          <li><a class="card" href="${esc(BASE + (it.href || ""))}">
            <div class="name">${mark(it.name, kw)}</div>
          </a></li>`).join("")}</ul>
      </section>`;
    }

    app.innerHTML  = html;
    empty.style.display = shown ? "none" : "block";
    count.textContent = kw ? `${shown} / ${all.length}` : `${all.length} 个`;
  }

  input.addEventListener("input", render);

  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== input) {
      e.preventDefault(); input.focus();
    }
    if (e.key === "Escape") { input.value = ""; input.blur(); render(); }
  });

  render();
})();
</script>
</body>
</html>
