<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>AI 简史 · 从一颗神经元到万亿参数</title>
<style>
:root{
  --bg:#08090c;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.16);
  --text:#e9edf3;
  --text-2:#a3adbc;
  --text-3:#6b7688;
  --accent:#7ee0d0;
  --accent-live:#7ee0d0;
  --maxw:1180px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:110px}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  line-height:1.75;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:rgba(126,224,208,.25);color:#fff}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:68px 68px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%);
}
#bg{position:fixed;inset:0;z-index:0;opacity:.7;pointer-events:none}
.cursor-glow{
  position:fixed;left:0;top:0;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(126,224,208,.06),rgba(138,166,255,.035) 42%,transparent 70%);
  pointer-events:none;z-index:1;will-change:transform;
}
@media (pointer:coarse){.cursor-glow{display:none}}
.progress{
  position:fixed;top:0;left:0;z-index:70;height:2px;width:100%;
  transform-origin:0 50%;transform:scaleX(0);
  background:linear-gradient(90deg,#7ee0d0,#8aa6ff 60%,#e6b980);
  opacity:.85;will-change:transform;
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 26px;
  background:rgba(8,9,12,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:12px;letter-spacing:.1em;
}
.topbar .brand{
  display:inline-flex;align-items:center;gap:9px;
  color:var(--text-2);text-decoration:none;font-weight:500;letter-spacing:.12em;
  transition:color .3s;
}
.topbar .brand:hover{color:var(--text)}
.brand-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px rgba(126,224,208,.9);animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
.topbar-sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  color:var(--accent-live);
  transition:color .6s ease;
}
.era-chips{
  position:sticky;top:54px;z-index:50;
  display:flex;gap:8px;overflow-x:auto;padding:12px 26px;
  background:linear-gradient(180deg,rgba(8,9,12,.92),rgba(8,9,12,.55) 70%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  scrollbar-width:none;
}
.era-chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 15px;border-radius:999px;
  border:1px solid var(--line);background:transparent;
  color:var(--text-3);font-size:12px;letter-spacing:.06em;
  cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);
  white-space:nowrap;font-family:inherit;
}
.chip:hover{color:var(--text);border-color:var(--line-2);transform:translateY(-1px)}
.chip.on{
  color:var(--cc);border-color:color-mix(in srgb,var(--cc) 45%,transparent);
  background:color-mix(in srgb,var(--cc) 12%,transparent);
}
.hero{
  position:relative;z-index:2;
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;
  padding:100px 26px 120px;
}
.hero-inner{width:100%;max-width:var(--maxw);margin:0 auto}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:32px;
  opacity:0;animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .1s forwards;
}
.hero-title{display:flex;flex-direction:column;margin-bottom:34px;line-height:.86}
.hero-title .t1{
  font-size:clamp(76px,19vw,200px);font-weight:700;letter-spacing:-.055em;
  background:linear-gradient(135deg,#f2fbfa 0%,#7ee0d0 46%,#8aa6ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeUp 1s cubic-bezier(.22,1,.36,1) .2s forwards;
}
.hero-title .t2{
  font-size:clamp(38px,9vw,92px);font-weight:200;letter-spacing:.06em;color:#8b95a5;
  opacity:0;animation:fadeUp 1s cubic-bezier(.22,1,.36,1) .34s forwards;
}
.lede{
  font-size:clamp(14px,1.6vw,16.5px);line-height:2;color:var(--text-2);max-width:560px;
  opacity:0;animation:fadeUp 1s cubic-bezier(.22,1,.36,1) .48s forwards;
}
.hero-stats{
  display:flex;gap:54px;margin-top:60px;
  opacity:0;animation:fadeUp 1s cubic-bezier(.22,1,.36,1) .62s forwards;
}
.stat strong{
  display:block;font-family:var(--mono);
  font-size:clamp(24px,3.6vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.2;
  background:linear-gradient(180deg,#fff,#8fa0b5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat span{font-size:11px;letter-spacing:.16em;color:var(--text-3)}
.hero-tip{
  margin-top:40px;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--text-3);
  opacity:0;
  animation:fadeUp 1s ease 1.05s forwards;
}
.hero-tip kbd{
  display:inline-block;
  padding:1px 7px;margin:0 3px;
  border:1px solid var(--line-2);
  border-radius:4px;
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-2);
  background:rgba(255,255,255,.03);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.scroll-cue{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  font-size:10px;letter-spacing:.28em;color:var(--text-3);
  text-decoration:none;cursor:pointer;
  opacity:0;animation:fadeUp 1s ease 1.2s forwards;transition:color .3s;
}
.scroll-cue:hover{color:var(--text-2)}
.scroll-cue i{
  display:block;width:1px;height:46px;
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);
  transform-origin:top;animation:cue 2.4s ease-in-out infinite;
}
@keyframes cue{0%,100%{opacity:.25;transform:scaleY(.55)}50%{opacity:1;transform:scaleY(1)}}
.timeline{position:relative;z-index:2;padding-bottom:40px}
.tl-group{max-width:var(--maxw);margin:0 auto;padding:0 26px}
.era{text-align:center;padding:96px 0 52px;position:relative}
.era::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:520px;height:260px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--era) 9%,transparent),transparent 70%);
  opacity:.9;
}
.era-range{
  display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;
  color:color-mix(in srgb,var(--era) 82%,#fff);margin-bottom:16px;opacity:.9;position:relative;
}
.era h2{
  font-size:clamp(23px,3.4vw,34px);font-weight:500;letter-spacing:-.015em;
  line-height:1.35;color:#dfe6ee;margin-bottom:14px;position:relative;
}
.era p{
  font-size:14px;color:var(--text-3);max-width:460px;margin:0 auto;line-height:1.9;position:relative;
}
.tl-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:36px;
  align-items:start;
  scroll-margin-top:130px;
}
.tl-card{
  position:relative;margin:14px 0;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);
  background:linear-gradient(158deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  cursor:pointer;
  opacity:0;
  transition:
    opacity .85s cubic-bezier(.22,1,.36,1) var(--d,0s),
    transform .85s cubic-bezier(.22,1,.36,1) var(--d,0s),
    border-color .4s ease,box-shadow .4s ease,background .4s ease;
}
.tl-item.left .tl-card{transform:translateY(26px) translateX(-18px)}
.tl-item.right .tl-card{transform:translateY(26px) translateX(18px)}
.tl-item.in-view .tl-card{opacity:1;transform:translateY(0) translateX(0)}
.tl-item.in-view .tl-card:hover{
  border-color:color-mix(in srgb,var(--era) 40%,transparent);
  box-shadow:0 22px 60px -34px color-mix(in srgb,var(--era) 85%,transparent);
}
.tl-card:focus-visible{outline:1px solid color-mix(in srgb,var(--era) 55%,transparent);outline-offset:3px}
.tl-item.active .tl-card{
  border-color:color-mix(in srgb,var(--era) 32%,transparent);
  box-shadow:0 20px 56px -40px color-mix(in srgb,var(--era) 90%,transparent);
}
.tl-item.left .tl-card{grid-column:1;grid-row:1}
.tl-item.right .tl-card{grid-column:2;grid-row:1}
.tl-visual{
  position:relative;
  padding-bottom:50%;
  overflow:hidden;
  background:#0b0d11;
  border-bottom:1px solid var(--line);
}
.tl-visual svg{
  position:absolute;top:0;left:0;width:100%;height:100%;display:block;
}
.tl-visual::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%,transparent 48%,rgba(0,0,0,.42)),
    linear-gradient(180deg,rgba(255,255,255,.04),transparent 26%);
}
.tl-media-tag{
  position:absolute;top:10px;left:10px;z-index:3;
  font-size:9px;letter-spacing:.14em;
  padding:3px 8px;border-radius:4px;
  background:rgba(10,12,16,.7);
  color:rgba(233,237,243,.82);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-family:var(--mono);
}
.tl-main{padding:20px 24px 50px;position:relative}
.tl-year{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;
  color:color-mix(in srgb,var(--era) 72%,#fff);margin-bottom:8px;opacity:.92;
}
.tl-card h3{
  font-size:18.5px;font-weight:600;letter-spacing:-.01em;
  color:#eef2f7;margin-bottom:12px;line-height:1.45;
}

/* === 题记：每张卡片的一句话 === */
.tl-quote{
  position:relative;
  padding:2px 0 2px 14px;
  margin-bottom:16px;
  border-left:2px solid color-mix(in srgb,var(--era) 55%,transparent);
  font-size:13.5px;
  line-height:1.7;
  letter-spacing:.01em;
  color:color-mix(in srgb,var(--era) 68%,#dfe6ee);
  font-weight:400;
  transition:border-color .3s, color .3s;
}
.tl-item.active .tl-quote{
  border-left-color:var(--era);
  color:color-mix(in srgb,var(--era) 82%,#fff);
}

.tl-card > .tl-main > p{font-size:14.5px;line-height:1.88;color:var(--text-2)}
.tl-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tl-tags span{
  font-size:11px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;
  color:color-mix(in srgb,var(--era) 78%,#fff);
  background:color-mix(in srgb,var(--era) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--era) 20%,transparent);
  white-space:nowrap;
}
.tl-detail{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .65s cubic-bezier(.22,1,.36,1),opacity .45s ease,margin-top .45s ease;
}
.tl-card.open .tl-detail{max-height:720px;opacity:1;margin-top:20px}
.tl-detail-inner{padding-top:18px;border-top:1px solid var(--line)}
.tl-detail-text{font-size:13.5px;line-height:1.95;color:var(--text-2)}
.tl-facts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.tl-facts > div{display:grid;grid-template-columns:66px 1fr;gap:12px}
.tl-facts dt{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--text-3);padding-top:2px;
}
.tl-facts dd{font-size:12.5px;color:var(--text-2);line-height:1.7}
.tl-toggle{
  position:absolute;right:20px;bottom:16px;
  width:16px;height:16px;
  display:grid;place-items:center;
  opacity:.4;
  transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s;
}
.tl-toggle::before{
  content:'';display:block;
  width:7px;height:7px;
  border-right:1.5px solid var(--text-2);
  border-bottom:1.5px solid var(--text-2);
  transform:rotate(45deg) translate(-2px,-2px);
  transition:border-color .3s;
}
.tl-card:hover .tl-toggle{opacity:.9}
.tl-card.open .tl-toggle{transform:rotate(180deg);opacity:1}
.tl-card.open .tl-toggle::before{border-color:var(--era)}
.rail{
  position:fixed;right:24px;top:50%;transform:translateY(-50%);
  z-index:40;display:flex;flex-direction:column;gap:14px;
}
.rail a{
  position:relative;width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.14);
  transition:background .35s,transform .35s,box-shadow .35s;
}
.rail a:hover{background:rgba(255,255,255,.45)}
.rail a.on{
  background:var(--accent);transform:scale(1.5);
  box-shadow:0 0 12px rgba(126,224,208,.85);
}
.rail a::after{
  content:attr(data-label);position:absolute;right:20px;top:50%;
  transform:translateY(-50%) translateX(6px);
  white-space:nowrap;font-size:11px;letter-spacing:.1em;color:var(--text-2);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
.rail a:hover::after{opacity:1;transform:translateY(-50%) translateX(0)}
@media (max-width:1100px){.rail{display:none}}
.outro{
  position:relative;z-index:2;text-align:center;padding:140px 26px 120px;
  background:radial-gradient(ellipse 70% 65% at 50% 45%,rgba(126,224,208,.065),transparent 72%);
}
.outro-eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--text-3);margin-bottom:26px;
}
.outro h2{
  font-size:clamp(28px,5.2vw,54px);font-weight:200;line-height:1.32;
  letter-spacing:-.02em;color:#e9edf3;margin-bottom:26px;
}
.outro h2 em{
  font-style:normal;
  background:linear-gradient(120deg,#7ee0d0,#8aa6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.outro p{font-size:14.5px;line-height:2;color:var(--text-2);max-width:560px;margin:0 auto 42px}
.to-top{
  display:inline-flex;align-items:center;gap:9px;
  padding:12px 26px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--text-2);text-decoration:none;font-size:13px;letter-spacing:.08em;
  transition:border-color .35s,color .35s,background .35s,transform .35s;
}
.to-top:hover{border-color:rgba(126,224,208,.5);color:#d9fbf5;background:rgba(126,224,208,.06);transform:translateY(-2px)}
footer{
  position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;
  padding:32px 26px 56px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:12px;letter-spacing:.05em;color:var(--text-3);
}
@media (max-width:820px){
  .topbar{padding:0 18px;height:50px}
  .era-chips{top:50px;padding:11px 18px}
  .hero{padding:96px 20px 110px}
  .hero-stats{gap:32px;margin-top:46px}
  .hero-tip{display:none}
  .lede br{display:none}
  .tl-group{padding:0 18px}
  .era{padding:70px 0 40px}
  .era::after{width:340px;height:200px}
  .tl-item{grid-template-columns:minmax(0,1fr);column-gap:0}
  .tl-item.left .tl-card,
  .tl-item.right .tl-card{grid-column:1;grid-row:1}
  .tl-item.left .tl-card{transform:translateY(26px)}
  .tl-item.right .tl-card{transform:translateY(26px)}
  .tl-card{margin:9px 0;border-radius:14px}
  .tl-main{padding:17px 18px 46px}
  .tl-card h3{font-size:17px}
  .tl-quote{font-size:12.8px;padding-left:12px;margin-bottom:13px}
  .tl-card > .tl-main > p{font-size:13.6px;line-height:1.85}
  .tl-year{font-size:11.5px;letter-spacing:.14em}
  .tl-toggle{right:15px;bottom:14px}
  .tl-facts > div{grid-template-columns:60px 1fr;gap:10px}
  .tl-card.open .tl-detail{max-height:900px}
  .tl-media-tag{font-size:8.5px;padding:2px 7px;top:8px;left:8px}
  .outro{padding:100px 20px 90px}
}
@media (max-width:380px){
  .hero-stats{gap:20px}
  .stat span{letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  .tl-card{opacity:1;transform:none !important}
  .hero-title .t1,.hero-title .t2,.eyebrow,.lede,.hero-stats,.hero-tip,.scroll-cue{opacity:1}
}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div class="cursor-glow" id="cursorGlow"></div>
<canvas id="bg"></canvas>

<header class="topbar">
  <a href="#top" class="brand"><span class="brand-dot"></span>AI 简史</a>
  <span class="topbar-sub" id="yearReadout">1943</span>
</header>

<nav class="rail" id="rail" aria-label="时代导航"></nav>

<main id="top">

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Artificial Intelligence · A Brief History</p>
      <h1 class="hero-title">
        <span class="t1">AI</span>
        <span class="t2">简史</span>
      </h1>
      <p class="lede">
        1943 年，两个人在论文里画下第一颗人工神经元。<br>
        八十年后，机器开始与我们对话。
      </p>
      <div class="hero-stats">
        <div class="stat"><strong data-count="82">0</strong><span>年历程</span></div>
        <div class="stat"><strong data-count="29">0</strong><span>个里程碑</span></div>
        <div class="stat"><strong data-count="6">0</strong><span>次浪潮</span></div>
      </div>
      <p class="hero-tip">
        用 <kbd>J</kbd> / <kbd>K</kbd> 或 <kbd>↑</kbd> <kbd>↓</kbd> 逐条浏览 · <kbd>Enter</kbd> 展开细节
      </p>
    </div>
    <a class="scroll-cue" href="#era-1" aria-label="向下滚动"><span>SCROLL</span><i></i></a>
  </section>

  <div class="era-chips" id="eraChips"></div>

  <div class="timeline" id="timeline"></div>

  <section class="outro">
    <p class="outro-eyebrow">2025 — ?</p>
    <h2>下一个八十年，<br><em>由谁书写？</em></h2>
    <p>
      从真空管到 GPU，从符号到向量，从手写规则到万亿参数。<br>
      AI 的历史从来不是一条直线——它是几次被放弃、又被重新捡起的信念。
    </p>
    <a class="to-top" href="#top">回到开头 ↑</a>
  </section>

</main>

<footer>
  <span>AI 简史 · 一个关于「思考如何被复刻」的故事</span>
  <span>1943 — 2025</span>
</footer>

<script>
(function(){
  'use strict';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ==================================================
     数据：每个事件都有一句「题记」
     ================================================== */
  const ERAS = [
    { id:'era-1', label:'思想的奠基', range:'1943 — 1956', color:'#7ee0d0',
      sub:'在计算机刚刚诞生的年代，人们已经开始追问：思维，能否被复刻？' },
    { id:'era-2', label:'乐观与幻灭', range:'1957 — 1969', color:'#8fb2f5',
      sub:'一个被过度承诺的年代。希望升得很快，落得也很快。' },

  timelineEl.innerHTML = html;
  chipsEl.innerHTML = chipsHtml;
  railEl.innerHTML = railHtml;

  const chips = Array.prototype.slice.call(chipsEl.querySelectorAll('.chip'));
  const railLinks = Array.prototype.slice.call(railEl.querySelectorAll('a'));
  const groupEls = Array.prototype.slice.call(document.querySelectorAll('.tl-group'));
  const items = Array.prototype.slice.call(document.querySelectorAll('.tl-item'));

  /* ==================================================
     URL hash：打开 / 关闭卡片时同步地址
     ================================================== */
  function setHash(hash){
    if(!history.replaceState) return;
    const url = hash
      ? window.location.pathname + window.location.search + '#' + hash
      : window.location.pathname + window.location.search;
    history.replaceState(null, '', url);
  }

  document.querySelectorAll('.tl-card').forEach(function(card){
    card.addEventListener('click', function(){
      const wasOpen = card.classList.contains('open');
      const open = !wasOpen;
      card.classList.toggle('open', open);
      card.setAttribute('aria-expanded', open ? 'true' : 'false');

      // 点击展开时同步到 URL hash，方便分享
      const item = card.closest('.tl-item');
      if(open && item){
        setHash(item.id);
      } else {
        // 收起时保留当前项，但不清空 hash
      }
    });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        card.click();
      }
    });
  });

  // 首屏如果有 hash，滚动到对应事件
  if(window.location.hash && window.location.hash.indexOf('#ev-') === 0){
    const target = document.querySelector(window.location.hash);
    if(target){
      window.addEventListener('load', function(){
        setTimeout(function(){
          target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
          const card = target.querySelector('.tl-card');
          if(card && !card.classList.contains('open')){
            card.classList.add('open');
            card.setAttribute('aria-expanded', 'true');
          }
        }, 300);
      });
    }
  }

  /* ==================================================
     出场 + 高亮 + 动态主题色
     ================================================== */
  groupEls.forEach(function(group){
    const groupItems = Array.prototype.slice.call(group.querySelectorAll('.tl-item'));
    groupItems.forEach(function(el, i){
      el.style.setProperty('--d', Math.min(i, 2) * 80 + 'ms');
    });
  });

  if('IntersectionObserver' in window){
    const revealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.06, rootMargin: '0px 0px -4% 0px' });

    items.forEach(function(el){ revealObserver.observe(el); });

    // 当前项高亮：更新顶部年份读数 + 页面强调色
    const activeObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('active');
          const y = entry.target.dataset.year;
          if(y && yearReadout.textContent !== y){
            yearReadout.textContent = y;
          }
          // 找到所在时代，取色更新强调色
          const group = entry.target.closest('.tl-group');
          if(group){
            const color = group.dataset.color;
            if(color){
              document.documentElement.style.setProperty('--accent-live', color);
            }
          }
        } else {
          entry.target.classList.remove('active');
        }
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });

    items.forEach(function(el){ activeObserver.observe(el); });

    const eraObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          const idx = groupEls.indexOf(entry.target);
          chips.forEach(function(c, i){ c.classList.toggle('on', i === idx); });
          railLinks.forEach(function(l, i){ l.classList.toggle('on', i === idx); });
        }
      });
    }, { rootMargin: '-42% 0px -50% 0px', threshold: 0 });

    groupEls.forEach(function(g){ eraObserver.observe(g); });
  } else {
    items.forEach(function(el){ el.classList.add('in-view'); });
  }

  chips.concat(railLinks).forEach(function(el){
    el.addEventListener('click', function(e){
      const target = document.getElementById(el.dataset.target);
      if(target){
        e.preventDefault();
        target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      }
    });
  });

  /* ==================================================
     键盘翻页：J/K 或 ↑/↓ 逐条浏览，Esc 收起全部
     ================================================== */
  let currentIndex = -1;

  function focusEvent(index, opts){
    if(index < 0 || index >= items.length) return;
    currentIndex = index;
    const el = items[index];
    const target = el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.35;
    window.scrollTo({
      top: target,
      behavior: (opts && opts.instant) ? 'auto' : (reduceMotion ? 'auto' : 'smooth')
    });
    // 给一个短暂的高亮类，让卡片自己闪一下
    el.classList.add('active');
    setTimeout(function(){ el.classList.remove('active'); }, 600);
  }

  document.addEventListener('keydown', function(e){
    // 不拦截带修饰键的按键
    if(e.metaKey || e.ctrlKey || e.altKey) return;

    const key = e.key;
    const isNext = key === 'j' || key === 'J' || key === 'ArrowDown';
    const isPrev = key === 'k' || key === 'K' || key === 'ArrowUp';
    const isEsc = key === 'Escape';

    if(isNext){
      // 已展开时，方向键下先跳到下一个
      const nextIdx = currentIndex < 0 ? 0 : Math.min(items.length - 1, currentIndex + 1);
      e.preventDefault();
      focusEvent(nextIdx);
      return;
    }
    if(isPrev){
      const prevIdx = currentIndex <= 0 ? 0 : currentIndex - 1;
      e.preventDefault();
      focusEvent(prevIdx);
      return;
    }
    if(isEsc){
      document.querySelectorAll('.tl-card.open').forEach(function(c){
        c.classList.remove('open');
        c.setAttribute('aria-expanded', 'false');
      });
    }
  });

  /* ==================================================
     进度条
     ================================================== */
  const progressEl = document.getElementById('progress');
  let rafScroll = false;

  function updateProgress(){
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(window.scrollY / max, 1) : 0;
    progressEl.style.transform = 'scaleX(' + p + ')';
    rafScroll = false;
  }

  window.addEventListener('scroll', function(){
    if(!rafScroll){
      rafScroll = true;
      requestAnimationFrame(updateProgress);
    }
  }, { passive: true });
  updateProgress();

  /* ==================================================
     数字滚动
     ================================================== */
  function countUp(el){
    const target = parseInt(el.dataset.count, 10) || 0;
    if(reduceMotion){ el.textContent = target; return; }
    const duration = 1500;
    const start = performance.now();
    function tick(now){
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased);
      if(t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  const counters = Array.prototype.slice.call(document.querySelectorAll('[data-count]'));
  if('IntersectionObserver' in window){
    const counterObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          countUp(entry.target);
          counterObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(function(el){ counterObserver.observe(el); });
  } else {
    counters.forEach(function(el){ el.textContent = el.dataset.count; });
  }

  /* ==================================================
     Canvas 背景
     ================================================== */
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let points = [];
  let running = true;

  const COLORS = [[126,224,208],[138,166,255],[180,200,230]];

  function buildPoints(){
    const count = W < 720 ? 16 : (W < 1200 ? 30 : 42);
    points = [];
    for(let i = 0; i < count; i++){
      points.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.14,
        vy: (Math.random() - 0.5) * 0.14,
        r: Math.random() * 1.2 + 0.6,
        c: COLORS[Math.floor(Math.random() * COLORS.length)],
        a: Math.random() * 0.38 + 0.2
      });
    }
  }

  function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildPoints();
  }

  const MAX_DIST = window.innerWidth < 720 ? 106 : 148;
  const MAX_D2 = MAX_DIST * MAX_DIST;

  function drawFrame(){
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < points.length; i++){
      const p = points[i];
      for(let j = i + 1; j < points.length; j++){
        const q = points[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d2 = dx*dx + dy*dy;
        if(d2 < MAX_D2){
          const d = Math.sqrt(d2);
          const alpha = (1 - d / MAX_DIST) * 0.12;
          ctx.strokeStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + alpha + ')';
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
    for(let i = 0; i < points.length; i++){
      const p = points[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < -30) p.x = W + 30;
      if(p.x > W + 30) p.x = -30;
      if(p.y < -30) p.y = H + 30;
      if(p.y > H + 30) p.y = -30;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + p.a + ')';
      ctx.fill();
    }
  }

  let lastTime = 0;
  const FRAME_INTERVAL = 1000 / 40;

  function loop(now){
    if(!running) return;
    if(now - lastTime >= FRAME_INTERVAL){
      drawFrame();
      lastTime = now;
    }
    requestAnimationFrame(loop);
  }

  resizeCanvas();
  if(reduceMotion){ drawFrame(); } else { requestAnimationFrame(loop); }

  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resizeCanvas();
      if(reduceMotion) drawFrame();
    }, 180);
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running = false; }
    else if(!reduceMotion){ running = true; lastTime = 0; requestAnimationFrame(loop); }
  });

  /* ==================================================
     光标柔光
     ================================================== */
  const glow = document.getElementById('cursorGlow');
  const finePointer = window.matchMedia('(pointer: fine)').matches;

  if(finePointer && !reduceMotion){
    let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
    let cx = tx, cy = ty;
    window.addEventListener('pointermove', function(e){
      tx = e.clientX; ty = e.clientY;
    }, { passive: true });
    (function glowLoop(){
      cx += (tx - cx) * 0.07;
      cy += (ty - cy) * 0.07;
      glow.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0) translate(-50%,-50%)';
      requestAnimationFrame(glowLoop);
    })();
  } else {
    glow.style.display = 'none';
  }

})();
</script>
</body>
</html>
