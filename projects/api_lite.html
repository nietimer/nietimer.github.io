/* =====================================================
   发送请求
   ===================================================== */
async function sendRequest() {
  if (currentAbort) {
    currentAbort.abort();
    currentAbort = null;
    return;
  }

  let url = ($('#urlInput').value || '').trim();
  if (!url) { toast('请输入请求 URL'); $('#urlInput').focus(); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  const method = state.method;
  const headers = {};

  state.headers.forEach(h => {
    if (h.enabled && h.key.trim()) headers[h.key.trim()] = h.value;
  });

  const a = state.auth;
  if (a.type === 'bearer' && a.token) headers['Authorization'] = 'Bearer ' + a.token;
  else if (a.type === 'basic' && (a.username || a.password)) {
    try { headers['Authorization'] = 'Basic ' + btoa(a.username + ':' + a.password); } catch (e) {}
  } else if (a.type === 'apikey' && a.key) {
    if (a.in === 'query') url += (url.includes('?') ? '&' : '?') + encodeURIComponent(a.key) + '=' + encodeURIComponent(a.value);
    else headers[a.key] = a.value;
  }

  let body;
  const hasCT = () => Object.keys(headers).some(k => k.toLowerCase() === 'content-type');
  if (!['GET', 'HEAD'].includes(method)) {
    const bt = state.body.type;
    if (bt === 'json') {
      body = state.body.raw || '';
      if (!hasCT()) headers['Content-Type'] = 'application/json';
    } else if (bt === 'raw') {
      body = state.body.raw || '';
      if (!hasCT()) headers['Content-Type'] = 'text/plain';
    } else if (bt === 'form') {
      const fd = new FormData();
      state.body.form.forEach(r => { if (r.enabled && r.key) fd.append(r.key, r.value); });
      body = fd;
      delete headers['Content-Type'];
    } else if (bt === 'urlencoded') {
      const usp = new URLSearchParams();
      state.body.urlencoded.forEach(r => { if (r.enabled && r.key) usp.append(r.key, r.value); });
      body = usp;
      if (!hasCT()) headers['Content-Type'] = 'application/x-www-form-urlencoded';
    }
  }

  const btn = $('#sendBtn');
  btn.classList.add('is-loading');
  btn.textContent = '取消';

  currentAbort = new AbortController();
  const signal = currentAbort.signal;
  const t0 = performance.now();

  let timedOut = false;
  const timeoutId = setTimeout(() => {
    timedOut = true;
    if (currentAbort) currentAbort.abort();
  }, TIMEOUT_MS);

  try {
    const res = await fetch(url, { method, headers, body, signal, redirect: 'follow' });
    const text = await res.text();
    const time = Math.round(performance.now() - t0);
    const size = new Blob([text]).size;

    responseData = {
      status: res.status,
      statusText: res.statusText,
      ok: res.ok,
      headers: Array.from(res.headers.entries()),
      text,
      time,
      size,
      url: res.url || url,
      _parsed: undefined,
      _isJson: false
    };

    renderResponse();
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab) tab.response = responseData;

    pushHistory({
      method, url, status: res.status, time,
      headers: deepClone(state.headers),
      body: deepClone(state.body),
      auth: { ...state.auth }
    });
  } catch (err) {
    if (err.name === 'AbortError') {
      if (timedOut) toast('请求超时（30s）');
      else toast('请求已取消');
    } else {
      showError(err);
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) tab.response = null;
      pushHistory({
        method, url, status: 0, time: 0,
        headers: deepClone(state.headers),
        body: deepClone(state.body),
        auth: { ...state.auth }
      });
    }
  } finally {
    clearTimeout(timeoutId);
    btn.classList.remove('is-loading');
    btn.textContent = '发送';
    currentAbort = null;
  }
}

/* =====================================================
   响应渲染
   ===================================================== */
function statusClass(code) {
  if (code >= 200 && code < 300) return 'ok';
  if (code >= 300 && code < 400) return 'redirect';
  if (code >= 400 && code < 500) return 'client';
  if (code >= 500) return 'server';
  return '';
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function looksLikeJson(t) {
  const s = t.trim();
  return (s.startsWith('{') && s.endsWith('}')) ||
         (s.startsWith('[') && s.endsWith(']')) ||
         (s.startsWith('"') && s.endsWith('"'));
}

function highlightJSON(json) {
  const safe = esc(json);
  return safe.replace(
    /("(?:\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?)/g,
    m => {
      let cls = 'num';
      if (/^"/.test(m)) cls = /:\s*$/.test(m) ? 'key' : 'str';
      else if (/^(true|false)$/.test(m)) cls = 'bool';
      else if (m === 'null') cls = 'null';
      return `<span class="tok-${cls}">${m}</span>`;
    }
  );
}

function renderResponse() {
  const r = responseData;
  if (!r) { showEmptyState(); return; }

  const sp = $('#statusPill');
  sp.textContent = `${r.status} ${r.statusText || ''}`.trim();
  sp.className = 'pill ' + statusClass(r.status);
  $('#timePill').textContent = r.time + ' ms';
  $('#sizePill').textContent = fmtSize(r.size);

  const ct = (r.headers.find(([k]) => k.toLowerCase() === 'content-type') || [, ''])[1];
  if (r.text.trim() && (/json/i.test(ct) || looksLikeJson(r.text))) {
    try {
      r._parsed = JSON.parse(r.text);
      r._isJson = true;
    } catch (e) { r._isJson = false; }
  }

  renderBodyPane();
  renderHeaderPane();
}

function renderHeaderPane() {
  const r = responseData;
  if (!r) return;
  if (r.headers.length) {
    $('#respHeaders').innerHTML = r.headers
      .map(([k, v]) => `<div class="hdr-row"><span class="hdr-key">${esc(k)}</span><span class="hdr-val">${esc(v)}</span></div>`)
      .join('');
  } else {
    $('#respHeaders').innerHTML = `<div class="empty-state">该响应没有暴露响应头（可能受 CORS 限制）</div>`;
  }
}

function renderBodyPane() {
  const r = responseData;
  const el = $('#respBody');
  el.style.setProperty('--code-fs', jsonFontSize + 'px');

  if (!r) { showEmptyState(); return; }

  if (!r._isJson) {
    if (!r.text) { el.innerHTML = `<div class="empty-state">响应体为空</div>`; return; }
    el.innerHTML = `<pre class="code-block">${esc(r.text)}</pre>`;
    return;
  }

  el.innerHTML = `
    <div class="json-toolbar">
      <div class="seg" id="viewSeg">
        <button class="seg-btn" data-view="tree">树形</button>
        <button class="seg-btn" data-view="raw">原始</button>
      </div>
      <span class="tb-spacer"></span>
      <button class="mini-btn" id="expandAllBtn">展开</button>
      <button class="mini-btn" id="collapseAllBtn">折叠</button>
      <div class="font-ctrl">
        <button class="mini-btn" id="fontDecBtn" title="缩小字号">A−</button>
        <span id="fontSizeLabel">${jsonFontSize.toFixed(1)}px</span>
        <button class="mini-btn" id="fontIncBtn" title="放大字号">A+</button>
      </div>
      <input class="json-search" id="jsonSearch" placeholder="搜索字段或值…" autocomplete="off" spellcheck="false">
    </div>
    <div class="json-view" id="jsonTree"></div>
    <pre class="code-block json-view" id="jsonRaw"></pre>
  `;

  const treeEl = $('#jsonTree');
  const total = countNodes(r._parsed);
  const expandedDepth = total > 3000 ? 1 : total > 800 ? 2 : 4;
  treeEl.appendChild(buildNode(null, r._parsed, false, 0, expandedDepth));

  const pretty = JSON.stringify(r._parsed, null, 2);
  $('#jsonRaw').innerHTML = highlightJSON(pretty);

  applyBodyView();
  bindJsonTools();
}

function typeOf(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function primitiveEl(v) {
  const span = document.createElement('span');
  const t = typeOf(v);
  span.className = 'j' + (t === 'object' ? 'null' : t);
  if (t === 'string') span.textContent = JSON.stringify(v);
  else if (t === 'null') span.textContent = 'null';
  else span.textContent = String(v);
  return span;
}

function buildNode(key, value, isArrayItem, depth, expandedDepth) {
  const t = typeOf(value);
  const isContainer = (t === 'object' || t === 'array');
  const keys = isContainer ? Object.keys(value) : [];
  const isEmpty = isContainer && keys.length === 0;

  const node = document.createElement('div');
  node.className = 'jnode';

  const row = document.createElement('div');
  row.className = 'jrow';

  const toggle = document.createElement('span');
  toggle.className = (isContainer && !isEmpty) ? 'jtoggle' : 'jspacer';
  row.appendChild(toggle);

  if (key !== null && key !== undefined) {
    const kEl = document.createElement('span');
    if (isArrayItem) {
      kEl.className = 'jidx';
      kEl.textContent = key;
    } else {
      kEl.className = 'jkey';
      kEl.textContent = '"' + key + '"';
    }
    row.appendChild(kEl);

    const colon = document.createElement('span');
    colon.className = 'jcolon';
    colon.textContent = ':';
    row.appendChild(colon);
  }

  if (!isContainer) {
    const valWrap = document.createElement('span');
    valWrap.className = 'jvalwrap';
    valWrap.appendChild(primitiveEl(value));
    row.appendChild(valWrap);
    node.appendChild(row);
    return node;
  }

  const open = document.createElement('span');
  open.className = 'jbracket';
  open.textContent = t === 'array' ? '[' : '{';
  row.appendChild(open);

  if (isEmpty) {
    const close = document.createElement('span');
    close.className = 'jbracket';
    close.textContent = t === 'array' ? ']' : '}';
    row.appendChild(close);
    node.appendChild(row);
    return node;
  }

  const summary = document.createElement('span');
  summary.className = 'jsummary';
  summary.textContent = t === 'array' ? ' … ' + keys.length + ' 项' : ' … ' + keys.length + ' 个键';
  row.appendChild(summary);

  const foldedClose = document.createElement('span');
  foldedClose.className = 'jbracket jfolded-close';
  foldedClose.textContent = t === 'array' ? ' ]' : ' }';
  row.appendChild(foldedClose);

  node.appendChild(row);

  const children = document.createElement('div');
  children.className = 'jchildren';
  keys.forEach(k => {
    children.appendChild(buildNode(k, value[k], t === 'array', depth + 1, expandedDepth));
  });
  node.appendChild(children);

  const closeRow = document.createElement('div');
  closeRow.className = 'jrow jrow-close';
  const cb = document.createElement('span');
  cb.className = 'jbracket';
  cb.textContent = t === 'array' ? ']' : '}';
  closeRow.appendChild(cb);
  node.appendChild(closeRow);

  if (depth >= expandedDepth) node.classList.add('collapsed');

  const doToggle = e => {
    if (window.getSelection && window.getSelection().toString()) return;
    node.classList.toggle('collapsed');
    if (e) e.stopPropagation();
  };
  toggle.addEventListener('click', doToggle);
  row.addEventListener('click', doToggle);

  return node;
}

function countNodes(v) {
  let n = 1;
  if (v && typeof v === 'object') {
    for (const k in v) {
      if (Object.prototype.hasOwnProperty.call(v, k)) n += countNodes(v[k]);
    }
  }
  return n;
}

function applyBodyView() {
  const treeEl = $('#jsonTree'), rawEl = $('#jsonRaw');
  if (!treeEl) return;
  const isTree = respView === 'tree';
  treeEl.style.display = isTree ? '' : 'none';
  rawEl.style.display = isTree ? 'none' : '';

  $$('.seg-btn', $('#respBody')).forEach(b => b.classList.toggle('active', b.dataset.view === respView));

  const ea = $('#expandAllBtn'), ca = $('#collapseAllBtn'), s = $('#jsonSearch');
  if (ea) ea.disabled = !isTree;
  if (ca) ca.disabled = !isTree;
  if (s) s.disabled = !isTree;
}

function bindJsonTools() {
  $$('.seg-btn', $('#respBody')).forEach(b => {
    b.onclick = () => { respView = b.dataset.view; applyBodyView(); };
  });

  $('#expandAllBtn').onclick = () => {
    $$('.jnode', $('#jsonTree')).forEach(n => n.classList.remove('collapsed'));
  };

  $('#collapseAllBtn').onclick = () => {
    $$('.jnode', $('#jsonTree')).forEach(n => n.classList.add('collapsed'));
    const root = $('#jsonTree').firstElementChild;
    if (root) root.classList.remove('collapsed');
  };

  $('#fontIncBtn').onclick = () => setJsonFont(jsonFontSize + 0.8);
  $('#fontDecBtn').onclick = () => setJsonFont(jsonFontSize - 0.8);

  const s = $('#jsonSearch');
  s.oninput = () => searchJson(s.value);
}

function setJsonFont(px) {
  jsonFontSize = Math.min(20, Math.max(10, px));
  const el = $('#respBody');
  if (el) el.style.setProperty('--code-fs', jsonFontSize + 'px');
  const lbl = $('#fontSizeLabel');
  if (lbl) lbl.textContent = jsonFontSize.toFixed(1) + 'px';
}

function searchJson(q) {
  const tree = $('#jsonTree');
  if (!tree) return;
  tree.querySelectorAll('.jhit').forEach(el => el.classList.remove('jhit'));
  const query = (q || '').trim().toLowerCase();
  if (!query) return;

  let first = null, count = 0;
  const targets = tree.querySelectorAll('.jkey, .jidx, .jstring, .jnumber, .jboolean, .jnull');
  targets.forEach(el => {
    if (el.textContent.toLowerCase().includes(query)) {
      el.classList.add('jhit');
      count++;
      if (!first) first = el;
      revealAncestors(el);
    }
  });

  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (!count) toast('没有匹配的字段');
}

function revealAncestors(el) {
  let n = el.closest('.jnode');
  while (n) {
    n.classList.remove('collapsed');
    const parent = n.parentElement;
    n = parent ? parent.closest('.jnode') : null;
  }
}

function showError(err) {
  responseData = null;
  const sp = $('#statusPill');
  sp.textContent = '请求失败';
  sp.className = 'pill err';
  $('#timePill').textContent = '— ms';
  $('#sizePill').textContent = '— B';
  $('#respHeaders').innerHTML = `<div class="empty-state">暂无响应头</div>`;
  $('#respBody').innerHTML = `
    <div class="err-box">
      <div class="err-title">✕ 请求失败</div>
      <div class="err-msg">${esc(err.message || String(err))}</div>
      <div class="err-hint">
        常见原因：<br>
        · 目标服务器未开启 CORS 跨域许可（浏览器环境限制）<br>
        · 网络不可达、域名解析失败<br>
        · 请求被 HTTPS / HTTP 混合内容策略拦截<br><br>
        建议：换用支持跨域的公开 API 测试，例如 JSONPlaceholder、GitHub API。
      </div>
    </div>`;
}

function pushHistory(item) {
  history.unshift({ ...item, id: uid(), ts: Date.now() });
  history = history.slice(0, 80);
  saveHistory();
  renderHistory();
}

/* =====================================================
   事件绑定
   ===================================================== */
function bindEvents() {
  $('#themeBtn').onclick = () => applyTheme(state.theme === 'dark' ? 'light' : 'dark');

  $('#menuBtn').onclick = () => document.body.classList.toggle('sidebar-open');
  $('#scrim').onclick = closeSidebar;

  $$('.side-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.side-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $$('.side-panel').forEach(p => p.classList.remove('active'));
      $('#panel-' + tab.dataset.side).classList.add('active');
    };
  });

  $('#newCollectionBtn').onclick = () => {
    openModal({
      title: '新建集合',
      body: `
        <div class="modal-field">
          <label class="modal-label">集合名称</label>
          <input class="modal-input" id="mColName" placeholder="例如：用户服务 API" maxlength="40">
        </div>
      `,
      confirmText: '创建',
      onConfirm: () => {
        const name = ($('#mColName').value || '').trim();
        if (!name) { toast('请输入集合名称'); return false; }
        collections.push({ id: uid(), name, items: [] });
        saveCollections();
        renderCollections();
        toast('已创建集合');
        return true;
      }
    });
  };

  $('#importBtn').onclick = importCollections;
  $('#exportBtn').onclick = exportCollections;

  $('#historySearch').oninput = e => {
    historyFilter = e.target.value.trim();
    renderHistory();
  };

  $('#method').onchange = e => {
    state.method = e.target.value;
    e.target.dataset.m = state.method;
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab) tab.method = state.method;
    scheduleTabRender();
    saveState();
  };

  $('#urlInput').addEventListener('input', e => {
    state.url = e.target.value;
    parseParamsFromUrl();
    renderKV($('#paramsList'), state.params, 'params');
    updateBadges();
    scheduleTabRender();
    saveState();
  });
  $('#urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendRequest();
  });

  $$('.req-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.req-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $$('.tab-panel').forEach(p => p.classList.remove('active'));
      $(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    };
  });

  $$('[data-add]').forEach(btn => {
    btn.onclick = () => {
      const t = btn.dataset.add;
      const list = t === 'params' ? state.params : state.headers;
      list.push(kv());
      renderKV(t === 'params' ? $('#paramsList') : $('#headersList'), list, t);
      saveState();
      markDirty();
    };
  });

  const typeBar = document.createElement('div');
  typeBar.className = 'body-toolbar';
  typeBar.style.marginBottom = '8px';
  typeBar.innerHTML = `
    <select class="mini-select" id="bodyType" style="flex:0 0 172px">
      <option value="none">none</option>
      <option value="json">JSON</option>
      <option value="raw">raw (text)</option>
      <option value="form">form-data</option>
      <option value="urlencoded">x-www-form-urlencoded</option>
    </select>`;
  const bodyPanelParent = $('[data-panel="body"]');
  bodyPanelParent.insertBefore(typeBar, $('#bodyPanel'));

  const bodyTypeSel = $('#bodyType');
  bodyTypeSel.value = state.body.type;
  bodyTypeSel.onchange = () => {
    state.body.type = bodyTypeSel.value;
    renderBody();
    saveState();
    markDirty();
  };

  const origRenderBody = renderBody;
  renderBody = function () {
    origRenderBody();
    const sel = $('#bodyType');
    if (sel) sel.value = state.body.type;
  };

  $('#sendBtn').onclick = sendRequest;

  $('#saveBtn').onclick = handleSave;
  $('#saveAsBtn').onclick = handleSaveAs;

  $('#curlBtn').onclick = copyCurl;

  document.addEventListener('keydown', e => {
    const cmdKey = e.ctrlKey || e.metaKey;
    if (!cmdKey) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      sendRequest();
    } else if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      handleSave();
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      newTab();
    }
  });

  $$('.resp-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.resp-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $$('.resp-pane').forEach(p => p.classList.remove('active'));
      $('#resp' + (tab.dataset.rtab === 'body' ? 'Body' : 'Headers')).classList.add('active');
    };
  });

  $('#copyBtn').onclick = async () => {
    if (!responseData) return toast('没有可复制的内容');
    try {
      await navigator.clipboard.writeText(responseData.text);
      toast('已复制到剪贴板');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = responseData.text;
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast('已复制');
    }
  };

  $('#downloadBtn').onclick = () => {
    if (!responseData) return toast('没有可下载的内容');
    const ct = (responseData.headers.find(([k]) => k.toLowerCase() === 'content-type') || [, ''])[1];
    const ext = /json/i.test(ct) ? 'json' : /html/i.test(ct) ? 'html' : /xml/i.test(ct) ? 'xml' : 'txt';
    const blob = new Blob([responseData.text], { type: ct || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'response-' + Date.now() + '.' + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast('已开始下载');
  };

  document.addEventListener('touchmove', e => {
    if (document.body.classList.contains('sidebar-open') && !e.target.closest('.sidebar')) {
      e.preventDefault();
    }
  }, { passive: false });
}

function closeSidebar() {
  document.body.classList.remove('sidebar-open');
}

/* =====================================================
   初始化
   ===================================================== */
(function init() {
  loadPersisted();
  applyTheme(state.theme || 'dark');
  bindEvents();

  const initTab = {
    id: uid(),
    method: state.method,
    url: state.url,
    headers: deepClone(state.headers),
    body: deepClone(state.body),
    auth: { ...state.auth },
    source: null,
    response: null,
    dirty: false
  };
  tabs = [initTab];
  activeTabId = initTab.id;

  syncUI();
  renderTabs();
  renderCollections();
  renderHistory();
  showEmptyState();
})();
</script>
</body>
</html>
