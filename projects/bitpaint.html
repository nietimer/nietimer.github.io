<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二进制奇偶画笔 · 任意上限</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#f7f5ee;
    overflow:hidden;
    color:#1d2b47;
    font-family:"Cambria Math","Latin Modern Math","STIX Two Text",Georgia,"Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased;
  }
  #cv{position:fixed;inset:0;display:block;}

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    width:min(1020px,calc(100% - 24px));
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    padding:14px 18px 16px;
    border-radius:14px;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid rgba(45,75,130,.18);
    box-shadow:0 16px 44px rgba(30,55,105,.13),0 2px 6px rgba(30,55,105,.06);
  }

  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:13px;}
  .head h1{font-size:17px;font-weight:700;letter-spacing:.02em;}
  .head h1::before{content:"⟨ ";color:#2f5fd0;}
  .head h1::after{content:" ⟩";color:#2f5fd0;}
  .head .desc{font-size:12.5px;color:#5b6b86;line-height:1.55;}
  .head .desc em{font-style:italic;color:#2f5fd0;}

  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .row:last-child{margin-bottom:0;}

  button{
    font-family:inherit;font-size:13px;padding:7px 13px;border-radius:9px;
    border:1px solid rgba(45,75,130,.22);background:#fff;color:#1d2b47;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .08s;
  }
  button:hover{background:#eef3ff;border-color:rgba(47,95,208,.5);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:progress;}
  button.primary{
    background:#2f5fd0;border-color:#2f5fd0;color:#fff;
    box-shadow:0 2px 8px rgba(47,95,208,.3);
  }
  button.primary:hover{background:#2551bb;}

  .sep{width:1px;height:20px;background:rgba(45,75,130,.18);margin:0 2px;}

  .nfield{display:flex;align-items:center;gap:7px;font-size:13px;font-style:italic;color:#445672;}
  input[type=number]{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    width:104px;padding:6px 9px;font-size:13px;font-style:normal;
    border:1px solid rgba(45,75,130,.22);border-radius:9px;
    background:#fff;color:#1d2b47;outline:none;
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]:focus{border-color:#2f5fd0;box-shadow:0 0 0 3px rgba(47,95,208,.15);}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    height:4px;border-radius:2px;outline:none;cursor:pointer;
    flex:1;min-width:90px;
    background:linear-gradient(90deg,#2f5fd0,#8a2be2);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;border:2px solid #2f5fd0;
    box-shadow:0 1px 5px rgba(30,55,105,.35);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:#fff;
    border:2px solid #2f5fd0;box-shadow:0 1px 5px rgba(30,55,105,.35);cursor:pointer;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:2px;background:linear-gradient(90deg,#2f5fd0,#8a2be2);
  }

  .lbl{font-size:12px;color:#5b6b86;white-space:nowrap;font-style:italic;}
  .mono{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;color:#445672;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .hint{font-size:11.5px;color:#8593ab;font-style:italic;}
  .hint.warn{color:#b45309;}

  /* ---------- 读数表 ---------- */
  .readout{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    gap:1px;
    margin-top:13px;
    background:rgba(45,75,130,.16);
    border:1px solid rgba(45,75,130,.16);
    border-radius:10px;
    overflow:hidden;
  }
  .readout .cell{
    background:rgba(255,255,255,.78);
    padding:8px 11px;
    display:flex;flex-direction:column;gap:2px;min-width:0;
  }
  .readout .k{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#7486a3;
  }
  .readout .v{
    font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .readout .v.bin{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#2f5fd0;}
  .readout .v.odd{color:#c2185b;}
  .readout .v.even{color:#1f8a5b;}

  @media (max-width:720px){
    .panel{padding:12px;bottom:10px;border-radius:12px;}
    .head h1{font-size:15px;}
    .head .desc{font-size:11.5px;}
    .readout{grid-template-columns:repeat(auto-fit,minmax(94px,1fr));}
    input[type=number]{width:88px;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="panel">
  <div class="head">
    <h1>二进制奇偶画笔</h1>
    <p class="desc">
      设 <em>s</em>(<em>n</em>) 为 <em>n</em> 的二进制中 1 的个数：
      <em>s</em>(<em>n</em>) 为奇数 ⟹ 逆时针旋转 60°；为偶数 ⟹ 前进 1 单位。初始方向 −60°。
    </p>
  </div>

  <div class="row">
    <button id="playBtn" class="primary">▶ 播放</button>
    <button id="resetBtn">⟲ 重置</button>
    <span class="sep"></span>
    <label class="nfield">
      <span>n =</span>
      <input id="nInput" type="number" min="0" step="1" value="0">
    </label>
    <button id="gotoBtn">跳转</button>
    <button id="prevBtn" title="上一步">−1</button>
    <button id="nextBtn" title="下一步">+1</button>
  </div>

  <div class="row">
    <span class="lbl">进度</span>
    <input type="range" id="progress" min="0" step="1" value="0">
    <span class="mono" id="progressLabel">0 / 10000</span>
  </div>

  <div class="row">
    <span class="lbl">速度</span>
    <input type="range" id="speed" min="10" max="20000" step="10" value="400">
    <span class="mono" id="speedLabel">400 步/秒</span>
  </div>

  <div class="row">
    <label class="nfield">
      <span>上限 N<sub>max</sub> =</span>
      <input id="maxInput" type="number" min="1" step="1" value="10000">
    </label>
    <button id="applyMaxBtn">应用</button>
    <span class="hint" id="maxHint">可设为任意自然数，建议 ≤ 1,000,000</span>
  </div>

  <div class="readout">
    <div class="cell"><span class="k">当前 n</span><span class="v" id="rN">0</span></div>
    <div class="cell"><span class="k">二进制</span><span class="v bin" id="rBin">0</span></div>
    <div class="cell"><span class="k">Σ bᵢ</span><span class="v" id="rPc">0</span></div>
    <div class="cell"><span class="k">奇偶性</span><span class="v even" id="rPar">偶数</span></div>
    <div class="cell"><span class="k">执行</span><span class="v" id="rAct">前进 1 单位</span></div>
    <div class="cell"><span class="k">已绘点数</span><span class="v" id="rPts">1</span></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   0. 常量
   ========================================================= */
const HARD_MAX = 10_000_000;
const SOFT_MAX = 1_000_000;
const CHUNK    = 256;

const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');

const COS = new Float64Array(6);
const SIN = new Float64Array(6);
for (let i = 0; i < 6; i++) {
  const a = i * Math.PI / 3;
  COS[i] = Math.cos(a);
  SIN[i] = Math.sin(a);
}

function popcount(v) {
  v = v - ((v >> 1) & 0x55555555);
  v = (v & 0x33333333) + ((v >> 2) & 0x33333333);
  v = (v + (v >> 4)) & 0x0f0f0f0f;
  return (v * 0x01010101) >> 24;
}

/* =========================================================
   1. 路径数据
   ========================================================= */
let MAX_N     = 0;
let TOTAL_PTS = 0;

let pathX, pathY;
let ptsAfter;
let angAfter;
let snapMinX, snapMaxX, snapMinY, snapMaxY;

function rebuild(maxN) {
  MAX_N = maxN;

  pathX    = new Float64Array(MAX_N + 2);
  pathY    = new Float64Array(MAX_N + 2);
  ptsAfter = new Int32Array(MAX_N + 1);
  angAfter = new Uint8Array(MAX_N + 1);

  const snapCount = Math.ceil((MAX_N + 2) / CHUNK) + 2;
  snapMinX = new Float64Array(snapCount);
  snapMaxX = new Float64Array(snapCount);
  snapMinY = new Float64Array(snapCount);
  snapMaxY = new Float64Array(snapCount);

  let x = 0, y = 0;
  let a = 5;            // ★ -60°
  let c = 1;

  let mnx = 0, mxx = 0, mny = 0, mxy = 0;

  pathX[0] = 0;
  pathY[0] = 0;

  for (let n = 0; n <= MAX_N; n++) {
    if (popcount(n) & 1) {
      a = (a + 1) % 6;
    } else {
      x += COS[a];
      y += SIN[a];
      pathX[c] = x;
      pathY[c] = y;
      c++;
      if (x < mnx) mnx = x;
      if (x > mxx) mxx = x;
      if (y < mny) mny = y;
      if (y > mxy) mxy = y;
    }
    ptsAfter[n] = c;
    angAfter[n] = a;

    if (c % CHUNK === 0) {
      const idx = c / CHUNK;
      if (idx < snapCount) {
        snapMinX[idx] = mnx; snapMaxX[idx] = mxx;
        snapMinY[idx] = mny; snapMaxY[idx] = mxy;
      }
    }
  }

  TOTAL_PTS = c;
}

/* 包围盒查询 */
const box = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
function bboxOf(n) {
  if (n <= 1) {
    box.minX = box.maxX = box.minY = box.maxY = 0;
    return box;
  }
  const full = Math.floor(n / CHUNK);
  let mnx = snapMinX[full], mxx = snapMaxX[full];
  let mny = snapMinY[full], mxy = snapMaxY[full];

  for (let i = full * CHUNK; i < n; i++) {
    const px = pathX[i], py = pathY[i];
    if (px < mnx) mnx = px;
    if (px > mxx) mxx = px;
    if (py < mny) mny = py;
    if (py > mxy) mxy = py;
  }

  box.minX = mnx; box.maxX = mxx; box.minY = mny; box.maxY = mxy;
  return box;
}

/* =========================================================
   2. 画布
   ========================================================= */
let W = 0, H = 0, DPR = 1, vignette = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(window.innerWidth  || 300, 1);
  H = Math.max(window.innerHeight || 300, 1);

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  try {
    vignette = ctx.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.22,
      W / 2, H / 2, Math.max(W, H) * 0.78
    );
    vignette.addColorStop(0, 'rgba(255,255,255,0)');
    vignette.addColorStop(1, 'rgba(150,172,208,.22)');
  } catch (e) {
    vignette = null;
  }
}

/* =========================================================
   3. 相机
   ========================================================= */
let camS = 70, camX = 0, camY = 0, camInit = false, camSnap = true;

function computeTarget(k) {
  const n = (ptsAfter && ptsAfter[k]) || 1;
  const b = bboxOf(n);

  const bw = Math.max(b.maxX - b.minX, 0.5);
  const bh = Math.max(b.maxY - b.minY, 0.5);
  const pad = 92;

  let s = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh);
  if (!isFinite(s) || s <= 0) s = 70;
  s = Math.min(s, 70);
  s = Math.max(s, 0.25);

  let cx = (b.minX + b.maxX) / 2;
  let cy = (b.minY + b.maxY) / 2;
  if (!isFinite(cx)) cx = 0;
  if (!isFinite(cy)) cy = 0;

  return { s, cx, cy };
}

/* =========================================================
   4. 绘制
   ========================================================= */
const BANDS = 44;
const BAND_COLORS = [];
for (let b = 0; b < BANDS; b++) {
  const t = b / (BANDS - 1);
  BAND_COLORS.push(`hsl(${198 + t * 148}, 74%, ${44 - t * 8}%)`);
}

const GRID = 24;
const MAX_SEGMENTS_PER_FRAME = 40000;

function drawGrid() {
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(70,105,170,.075)';
  for (let x = 0; x <= W; x += GRID) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += GRID) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();

  const G5 = GRID * 5;
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(70,105,170,.155)';
  for (let x = 0; x <= W; x += G5) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += G5) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
}

function drawAxes(SX, SY) {
  const y0 = SY(0), x0 = SX(0);
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = 'rgba(70,105,170,.32)';
  ctx.lineWidth = 1;
  if (y0 > -8 && y0 < H + 8) {
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
  }
  if (x0 > -8 && x0 < W + 8) {
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke();
  }
  ctx.restore();
}

function draw(k) {
  /* ---- 背景 ---- */
  ctx.fillStyle = '#f7f5ee';
  ctx.fillRect(0, 0, W, H);
  if (vignette) { ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H); }

  drawGrid();

  /* ---- 安全取值 ---- */
  if (!ptsAfter || !Number.isFinite(k)) return;
  const n = ptsAfter[k];
  if (!Number.isFinite(n) || n < 1) return;

  const ox = W / 2, oy = H / 2;
  const SX = px => ox + camS * (px - camX);
  const SY = py => oy - camS * (py - camY);

  drawAxes(SX, SY);

  /* ---- 轨迹 ---- */
  if (n >= 2) {
    const segs = n - 1;
    const step = segs > MAX_SEGMENTS_PER_FRAME
      ? Math.ceil(segs / MAX_SEGMENTS_PER_FRAME)
      : 1;

    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.7;

    for (let b = 0; b < BANDS; b++) {
      const i0 = Math.floor(b * segs / BANDS);
      const i1 = Math.floor((b + 1) * segs / BANDS);
      if (i1 <= i0) continue;

      ctx.beginPath();
      ctx.moveTo(SX(pathX[i0]), SY(pathY[i0]));

      if (step === 1) {
        for (let i = i0 + 1; i <= i1; i++) {
          ctx.lineTo(SX(pathX[i]), SY(pathY[i]));
        }
      } else {
        for (let i = i0 + step; i < i1; i += step) {
          ctx.lineTo(SX(pathX[i]), SY(pathY[i]));
        }
        ctx.lineTo(SX(pathX[i1]), SY(pathY[i1]));
      }

      ctx.strokeStyle = BAND_COLORS[b];
      ctx.stroke();
    }
  }

  /* ---- 起点 ---- */
  if (n >= 1) {
    ctx.beginPath();
    ctx.arc(SX(pathX[0]), SY(pathY[0]), 3.6, 0, Math.PI * 2);
    ctx.fillStyle = '#1f9d6b';
    ctx.fill();
  }

  /* ---- 笔尖 ---- */
  const hx = SX(pathX[n - 1]);
  const hy = SY(pathY[n - 1]);

  if (!isFinite(hx) || !isFinite(hy)) return;   // 防御

  // 光晕
  ctx.beginPath();
  ctx.arc(hx, hy, 12, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(47,95,208,.14)';
  ctx.fill();

  // 实心笔尖
  ctx.beginPath();
  ctx.arc(hx, hy, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = '#12203a';
  ctx.fill();

  // 外圈
  ctx.beginPath();
  ctx.arc(hx, hy, 8, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(18,32,58,.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  /* ---- 朝向箭头 ---- */
  const ang = angAfter[k] * Math.PI / 3;
  const dx  = Math.cos(ang);
  const dy  = -Math.sin(ang);
  const L   = 30;

  const ax = hx + dx * L;
  const ay = hy + dy * L;

  ctx.beginPath();
  ctx.moveTo(hx + dx * 8, hy + dy * 8);
  ctx.lineTo(ax, ay);
  ctx.strokeStyle = 'rgba(18,32,58,.6)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  const px2 = -dy, py2 = dx;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - dx * 9 + px2 * 4.5, ay - dy * 9 + py2 * 4.5);
  ctx.lineTo(ax - dx * 9 - px2 * 4.5, ay - dy * 9 - py2 * 4.5);
  ctx.closePath();
  ctx.fillStyle = 'rgba(18,32,58,.6)';
  ctx.fill();
}

/* =========================================================
   5. DOM
   ========================================================= */
const playBtn       = document.getElementById('playBtn');
const resetBtn      = document.getElementById('resetBtn');
const prevBtn       = document.getElementById('prevBtn');
const nextBtn       = document.getElementById('nextBtn');
const gotoBtn       = document.getElementById('gotoBtn');
const nInput        = document.getElementById('nInput');
const progressEl    = document.getElementById('progress');
const progressLabel = document.getElementById('progressLabel');
const speedEl       = document.getElementById('speed');
const speedLabel    = document.getElementById('speedLabel');
const maxInput      = document.getElementById('maxInput');
const applyMaxBtn   = document.getElementById('applyMaxBtn');
const maxHint       = document.getElementById('maxHint');

const rN   = document.getElementById('rN');
const rBin = document.getElementById('rBin');
const rPc  = document.getElementById('rPc');
const rPar = document.getElementById('rPar');
const rAct = document.getElementById('rAct');
const rPts = document.getElementById('rPts');

/* =========================================================
   6. 状态
   ========================================================= */
let progress = 0;
let playing  = false;
let speed    = 400;
let lastT    = performance.now();
let lastK    = -1;

function setPlaying(v) {
  playing = v;
  playBtn.textContent = v ? '⏸ 暂停' : '▶ 播放';
}

function updateReadout(k) {
  if (k === lastK) return;
  lastK = k;

  const pc  = popcount(k);
  const odd = pc & 1;

  rN.textContent   = k.toLocaleString();
  rBin.textContent = k.toString(2);
  rPc.textContent  = pc;
  rPar.textContent = odd ? '奇数' : '偶数';
  rPar.className   = 'v ' + (odd ? 'odd' : 'even');
  rAct.textContent = odd ? '↺ 逆时针旋转 60°' : '→ 前进 1 单位';
  rPts.textContent = (ptsAfter[k] || 1).toLocaleString();

  progressLabel.textContent = `${k.toLocaleString()} / ${MAX_N.toLocaleString()}`;
  if (document.activeElement !== nInput) nInput.value = k;
}

/* =========================================================
   7. 交互
   ========================================================= */
function clampN(v) {
  v = Math.floor(Number(v));
  if (!isFinite(v)) return 0;
  return Math.max(0, Math.min(MAX_N, v));
}

function gotoN(v, pause = true) {
  const n = clampN(v);
  if (pause) setPlaying(false);
  progress = n;
  progressEl.value = n;
  camSnap = true;
  lastT = performance.now();
  lastK = -1;
}

playBtn.addEventListener('click', () => {
  if (!playing && progress >= MAX_N) {
    progress = 0;
    progressEl.value = 0;
    camSnap = true;
    lastK = -1;
  }
  setPlaying(!playing);
  lastT = performance.now();
});

resetBtn.addEventListener('click', () => {
  setPlaying(false);
  progress = 0;
  progressEl.value = 0;
  camSnap = true;
  lastK = -1;
});

prevBtn.addEventListener('click', () => gotoN(progress - 1));
nextBtn.addEventListener('click', () => gotoN(progress + 1));
gotoBtn.addEventListener('click', () => gotoN(nInput.value));

nInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoN(nInput.value); nInput.blur(); }
});

progressEl.addEventListener('input', () => {
  setPlaying(false);
  progress = clampN(progressEl.value);
  camSnap = true;
  lastT = performance.now();
});

speedEl.addEventListener('input', () => {
  speed = Math.max(1, Number(speedEl.value) || 400);
  speedLabel.textContent = `${speed.toLocaleString()} 步/秒`;
});

/* ---- 应用新上限 ---- */
applyMaxBtn.addEventListener('click', () => {
  let v = Math.floor(Number(maxInput.value));
  if (!isFinite(v) || v < 1) { maxInput.value = MAX_N; return; }

  const clamped = Math.min(HARD_MAX, v);
  if (clamped !== v) {
    maxHint.textContent = `已限制为最大值 ${HARD_MAX.toLocaleString()}`;
    maxHint.className = 'hint warn';
  }

  maxInput.value = clamped;
  applyMaxBtn.disabled = true;
  maxHint.textContent = '正在构建路径…';
  maxHint.className = 'hint';

  setTimeout(() => {
    const t0 = performance.now();
    rebuild(clamped);

    progressEl.max = MAX_N;
    nInput.max = MAX_N;

    if (progress > MAX_N) progress = MAX_N;
    progressEl.value = progress;

    camSnap = true;
    camInit = false;
    lastK = -1;
    lastT = performance.now();

    const ms = Math.round(performance.now() - t0);
    maxHint.textContent =
      `上限 ${MAX_N.toLocaleString()} · ${TOTAL_PTS.toLocaleString()} 个点 · 构建 ${ms} ms` +
      (MAX_N > SOFT_MAX ? '（数值较大，渲染可能变慢）' : '');
    maxHint.className = 'hint' + (MAX_N > SOFT_MAX ? ' warn' : '');

    applyMaxBtn.disabled = false;
  }, 40);
});

maxInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); applyMaxBtn.click(); }
});

window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.code === 'Space' && !/INPUT|BUTTON|TEXTAREA/.test(tag)) {
    e.preventDefault();
    playBtn.click();
  }
});

window.addEventListener('resize', () => {
  resize();
  camSnap = true;
});

/* =========================================================
   8. 主循环（含防御性修复）
   ========================================================= */
function frame(now) {
  /* ---- 1. dt 安全：有限、非负、上限 0.05 ---- */
  let dt = (now - lastT) / 1000;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  lastT = now;

  /* ---- 2. 推进进度 ---- */
  if (playing) {
    progress += speed * dt;

    if (!isFinite(progress)) progress = 0;
    if (progress < 0) progress = 0;

    if (progress >= MAX_N) {
      progress = MAX_N;
      setPlaying(false);
    }
    if (document.activeElement !== progressEl) {
      progressEl.value = progress;
    }
  }

  /* ---- 3. k 安全钳制 ---- */
  let k = Math.floor(progress);
  if (!isFinite(k) || k < 0) k = 0;
  if (k > MAX_N) k = MAX_N;

  /* ---- 4. 相机 ---- */
  const target = computeTarget(k);

  if (camSnap || !camInit ||
      !isFinite(camS) || !isFinite(camX) || !isFinite(camY)) {
    camS = target.s; camX = target.cx; camY = target.cy;
    camInit = true; camSnap = false;
  } else {
    const aPos  = 1 - Math.exp(-8 * dt);
    const aZoom = 1 - Math.exp(-3 * dt);
    camX += (target.cx - camX) * aPos;
    camY += (target.cy - camY) * aPos;
    camS += (target.s  - camS) * aZoom;

    if (!isFinite(camS) || !isFinite(camX) || !isFinite(camY)) {
      camS = target.s; camX = target.cx; camY = target.cy;
    }
  }

  /* ---- 5. 绘制 + 读数 ---- */
  draw(k);
  updateReadout(k);

  requestAnimationFrame(frame);
}

/* =========================================================
   9. 启动
   ========================================================= */
resize();
rebuild(10000);

progressEl.max = MAX_N;
nInput.max = MAX_N;
maxInput.value = MAX_N;

speed = Number(speedEl.value) || 400;
speedLabel.textContent = `${speed.toLocaleString()} 步/秒`;
setPlaying(false);
updateReadout(0);

maxHint.textContent =
  `上限 ${MAX_N.toLocaleString()} · ${TOTAL_PTS.toLocaleString()} 个点`;

requestAnimationFrame(frame);

})();
</script>
</body>
