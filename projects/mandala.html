<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>曼陀罗 · MANDALA</title>
<style>
  :root {
    --cyan: #6ee7ff;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #05060c;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #c {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    background: #05060c;
  }

  /* ============ 顶部 HUD ============ */
  .hud {
    position: fixed;
    top: calc(18px + var(--safe-top));
    left: 20px;
    display: flex;
    gap: 26px;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(255,255,255,0.38);
    z-index: 10;
    pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
  }
  .hud-item span {
    color: var(--cyan);
    font-weight: 500;
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }

  .brand {
    position: fixed;
    top: calc(18px + var(--safe-top));
    right: 20px;
    font-size: 10px;
    letter-spacing: 0.42em;
    color: rgba(255,255,255,0.22);
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .brand b { color: rgba(167,139,250,0.7); font-weight: 600; }

  /* ============ 开场文字 ============ */
  .intro {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
    text-align: center;
    padding: 0 24px;
    transition: opacity 1.1s cubic-bezier(.16,.9,.28,1),
                transform 1.1s cubic-bezier(.16,.9,.28,1);
  }
  .intro.hidden {
    opacity: 0;
    transform: scale(1.06);
  }
  .intro h1 {
    font-size: clamp(2.6rem, 13vw, 6rem);
    font-weight: 800;
    letter-spacing: 0.12em;
    line-height: 1;
    background: linear-gradient(135deg, #6ee7ff 0%, #a78bfa 48%, #ff6ec7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 42px rgba(167,139,250,0.4));
    animation: introPulse 4s ease-in-out infinite;
  }
  @keyframes introPulse {
    0%, 100% { filter: drop-shadow(0 0 32px rgba(167,139,250,0.3)); }
    50%      { filter: drop-shadow(0 0 58px rgba(167,139,250,0.6)); }
  }
  .intro p {
    margin-top: 26px;
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    letter-spacing: 0.46em;
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding-left: 0.46em;
  }
  .intro .tap-hint {
    margin-top: 54px;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: rgba(110,231,255,0.7);
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    animation: tapPulse 2.2s ease-in-out infinite;
  }
  @keyframes tapPulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  /* ============ 底部控制栏 ============ */
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(20px + var(--safe-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 15;
    padding: 7px 10px;
    border-radius: 26px;
    background: rgba(15, 17, 28, 0.6);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 14px 40px -18px rgba(0,0,0,0.9);
  }

  .dock-group { display: flex; align-items: center; gap: 8px; }

  .dock-divider {
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,0.08);
  }

  .ctrl-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75);
    font-size: 17px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.12s, color 0.2s;
    outline: none;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
    padding: 0;
  }

  .ctrl-btn:hover {
    background: rgba(110,231,255,0.1);
    border-color: rgba(110,231,255,0.3);
    color: var(--cyan);
  }

  .ctrl-btn:active,
  .ctrl-btn.active {
    transform: scale(0.9);
    background: rgba(110,231,255,0.18);
    border-color: rgba(110,231,255,0.55);
    color: var(--cyan);
    box-shadow: 0 0 18px -4px rgba(110,231,255,0.6);
  }

  .ctrl-btn svg { width: 16px; height: 16px; display: block; }

  .sym-val {
    min-width: 34px;
    text-align: center;
    font-size: 14px;
    color: var(--cyan);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    transition: transform 0.15s, text-shadow 0.15s;
  }
  .sym-val.bump {
    transform: scale(1.22);
    text-shadow: 0 0 14px rgba(110,231,255,0.9);
  }

  /* ============ 底部提示 ============ */
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(78px + var(--safe-bottom));
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.28em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    animation: hintFade 4s ease-in-out infinite;
    text-align: center;
    padding-left: 0.28em;
    transition: opacity 1.4s ease;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.42; }
    50%      { opacity: 0.95; }
  }

  /* ============ 边缘装饰 ============ */
  .edge {
    position: fixed;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.06);
    z-index: 5;
    pointer-events: none;
  }
  .edge.tl { top: calc(14px + var(--safe-top)); left: 14px; border-right: none; border-bottom: none; }
  .edge.tr { top: calc(14px + var(--safe-top)); right: 14px; border-left: none; border-bottom: none; }
  .edge.bl { bottom: calc(14px + var(--safe-bottom)); left: 14px; border-right: none; border-top: none; }
  .edge.br { bottom: calc(14px + var(--safe-bottom)); right: 14px; border-left: none; border-top: none; }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    .hud { gap: 16px; font-size: 10px; letter-spacing: 0.14em; left: 16px; }
    .brand { display: none; }
    .hint {
      font-size: 9px;
      letter-spacing: 0.18em;
      white-space: normal;
      width: 86%;
      line-height: 1.9;
      bottom: calc(80px + var(--safe-bottom));
    }
    .edge { width: 30px; height: 30px; }
    .dock { gap: 10px; padding: 6px 9px; }
    .dock-group { gap: 6px; }
    .ctrl-btn { width: 38px; height: 38px; }
    .sym-val { min-width: 28px; font-size: 13px; }
  }

  @media (max-width: 380px) {
    .dock { gap: 8px; }
    .ctrl-btn { width: 36px; height: 36px; }
  }

  @media (min-width: 900px) {
    .dock { bottom: calc(28px + var(--safe-bottom)); }
    .hint { bottom: calc(92px + var(--safe-bottom)); }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="hud-item">对称 <span id="hud-sym">8</span></div>
  <div class="hud-item">粒子 <span id="hud-count">0</span></div>
</div>

<div class="brand">MANDALA <b>/ 曼陀罗</b></div>

<div class="hint" id="hint">移动绘制 · 滚轮调对称 · 右键清空 · 空格暂停</div>

<div class="intro" id="intro">
  <h1>曼陀罗</h1>
  <p>Move to paint · Scroll to shape</p>
  <div class="tap-hint">轻触屏幕开始</div>
</div>

<div class="dock" id="dock">
  <div class="dock-group">
    <button class="ctrl-btn" id="btn-pause" aria-label="暂停">
      <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btn-clear" aria-label="清空">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 5 L19 19 M19 5 L5 19"/>
      </svg>
    </button>
  </div>

  <div class="dock-divider"></div>

  <div class="dock-group">
    <button class="ctrl-btn" id="sym-dec" aria-label="减少对称">−</button>
    <span class="sym-val" id="sym-val">8</span>
    <button class="ctrl-btn" id="sym-inc" aria-label="增加对称">+</button>
  </div>
</div>

<div class="edge tl"></div>
<div class="edge tr"></div>
<div class="edge bl"></div>
<div class="edge br"></div>

<script>
"use strict";

(function () {

  /* =====================================================
     设备 / 性能判定
     ===================================================== */
  var isTouchDevice = ('ontouchstart' in window) ||
                      (navigator.maxTouchPoints > 0) ||
                      window.matchMedia('(hover: none)').matches;
  var isSmallScreen = window.innerWidth < 640;
  var isMobile = isTouchDevice || isSmallScreen;

  var MAX_PARTICLES = isMobile ? 700 : 1600;
  var DPR_CAP = isMobile ? 1.5 : 2;

  /* =====================================================
     画布初始化
     ===================================================== */
  var canvas = document.getElementById("c");
  if (!canvas) { console.error("canvas #c not found"); return; }

  var ctx = canvas.getContext("2d", { alpha: false });
  if (!ctx) { console.error("2d context unavailable"); return; }

  var W = 0, H = 0, cx = 0, cy = 0;
  var maxRadiusSq = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = window.innerWidth || document.documentElement.clientWidth || 800;
    H = window.innerHeight || document.documentElement.clientHeight || 600;
    cx = W / 2;
    cy = H / 2;
    var maxRadius = Math.sqrt(cx * cx + cy * cy) * 1.15;
    maxRadiusSq = maxRadius * maxRadius;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#05060c";
    ctx.fillRect(0, 0, W, H);
  }

  var resizeTimer = null;
  function scheduleResize() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  }
  window.addEventListener("resize", scheduleResize);
  window.addEventListener("orientationchange", function () {
    setTimeout(resize, 220);
  });

  resize();

  /* =====================================================
     状态
     ===================================================== */
  var particles = [];
  var symmetry = 8;
  var hueBase = 200;
  var paused = false;
  var hasInteracted = false;
  var hueDrift = 0;

  var mouse = {
    x: cx,
    y: cy,
    down: false,
    totalDist: 0
  };

  /* =====================================================
     UI 元素
     ===================================================== */
  var hudSym = document.getElementById("hud-sym");
  var hudCount = document.getElementById("hud-count");
  var introEl = document.getElementById("intro");
  var symValEl = document.getElementById("sym-val");
  var btnPause = document.getElementById("btn-pause");
  var btnClear = document.getElementById("btn-clear");
  var symDecBtn = document.getElementById("sym-dec");
  var symIncBtn = document.getElementById("sym-inc");
  var iconPause = document.getElementById("icon-pause");
  var hintEl = document.getElementById("hint");

  /* 更新提示文案 */
  (function () {
    var tapHint = document.querySelector(".intro .tap-hint");
    if (isMobile) {
      if (hintEl) hintEl.textContent = "拖动绘制 · 轻触爆发";
      if (tapHint) tapHint.textContent = "轻触屏幕开始";
    } else {
      if (hintEl) hintEl.textContent = "移动绘制 · 滚轮调对称 · 右键清空 · 空格暂停";
    }
  })();

  function updateSymUI(bump) {
    var v = String(symmetry);
    if (hudSym) hudSym.textContent = v;
    if (symValEl) {
      symValEl.textContent = v;
      if (bump) {
        symValEl.classList.remove("bump");
        void symValEl.offsetWidth;
        symValEl.classList.add("bump");
        setTimeout(function () { symValEl.classList.remove("bump"); }, 180);
      }
    }
  }

  function setPausedUI() {
    if (!btnPause || !iconPause) return;
    if (paused) {
      iconPause.innerHTML = '<path d="M7 5 L19 12 L7 19 Z"/>';
      btnPause.classList.add("active");
    } else {
      iconPause.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
      btnPause.classList.remove("active");
    }
  }

  /* =====================================================
     粒子生成
     ===================================================== */
  function spawn(x, y, count, speed, hue) {
    var burstCap = isMobile ? 6 : 10;
    if (count > burstCap) count = burstCap;

    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) {
        particles.shift();
      }

      var a = Math.random() * Math.PI * 2;
      var s = speed * (0.4 + Math.random() * 1.2);

      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        hue: hue + (Math.random() - 0.5) * 70,
        life: 1,
        decay: 0.004 + Math.random() * 0.008,
        size: 1 + Math.random() * 1.8
      });
    }
  }

  /* =====================================================
     主循环
     ===================================================== */
  var TAU = Math.PI * 2;
  var lastTime = performance.now();
  var frameCount = 0;

  function frame(now) {
    var dt = Math.min(50, now - lastTime);
    lastTime = now;
    frameCount++;
    hueDrift += dt * 0.008;

    /* ---------- 拖尾 ---------- */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(5, 6, 12, 0.11)";
    ctx.fillRect(0, 0, W, H);

    /* ---------- 生成粒子 ---------- */
    if (!paused && mouse.totalDist > 0.5) {
      var rate = mouse.down ? (isMobile ? 0.22 : 0.14) : 0.08;
      var count = Math.min(
        isMobile ? 6 : 10,
        Math.max(1, Math.round(mouse.totalDist * rate))
      );
      var speed = 0.3 + Math.min(3, mouse.totalDist * 0.03);

      var hue = hueBase
        + (mouse.x / Math.max(1, W)) * 120
        + (mouse.y / Math.max(1, H)) * 80
        + hueDrift;

      spawn(mouse.x, mouse.y, count, speed, hue);
      mouse.totalDist = 0;
    } else if (mouse.totalDist > 0) {
      mouse.totalDist *= 0.5;
    }

    /* ---------- 绘制粒子 ---------- */
    ctx.globalCompositeOperation = "lighter";

    var sym = symmetry;
    var invSym = 1 / sym;
    var symAngles = new Array(sym);
    for (var s = 0; s < sym; s++) {
      var angle = s * invSym * TAU;
      symAngles[s] = { cos: Math.cos(angle), sin: Math.sin(angle) };
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];

      /* --- 物理 --- */
      if (!paused) {
        var pdx = p.x - cx;
        var pdy = p.y - cy;
        var pd = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        var invPd = 1 / pd;

        p.vx -= pdx * invPd * 0.0018 * dt * 0.6;
        p.vy -= pdy * invPd * 0.0018 * dt * 0.6;

        p.vx += -pdy * invPd * 0.0055 * dt * 0.6;
        p.vy += pdx * invPd * 0.0055 * dt * 0.6;

        p.vx *= 0.99;
        p.vy *= 0.99;

        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;

        p.life -= p.decay * dt * 0.06;
      }

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      var dx0 = p.x - cx;
      var dy0 = p.y - cy;
      if (dx0 * dx0 + dy0 * dy0 > maxRadiusSq) {
        particles.splice(i, 1);
        continue;
      }

      /* --- 绘制对称副本 --- */
      var alpha = p.life * 0.85;
      var light = 50 + p.life * 30;
      var size = p.size * (0.5 + p.life * 0.7);

      ctx.fillStyle = "hsla(" + (p.hue | 0) + ",100%," + (light | 0) + "%," + alpha + ")";
      ctx.beginPath();

      for (var k = 0; k < sym; k++) {
        var sa = symAngles[k];
        var rx = dx0 * sa.cos - dy0 * sa.sin;
        var ry = dx0 * sa.sin + dy0 * sa.cos;

        var sx = cx + rx;
        var sy = cy + ry;

        ctx.moveTo(sx + size, sy);
        ctx.arc(sx, sy, size, 0, TAU);
      }

      ctx.fill();
    }

    if (frameCount % 12 === 0 && hudCount) {
      hudCount.textContent = particles.length;
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  /* =====================================================
     开场遮罩
     ===================================================== */
  function firstInteraction() {
    if (hasInteracted) return;
    hasInteracted = true;
    if (introEl) {
      introEl.classList.add("hidden");
      setTimeout(function () {
        if (introEl) introEl.style.display = "none";
      }, 1200);
    }
  }

  /* =====================================================
     指针交互
     ===================================================== */
  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    firstInteraction();

    mouse.down = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.totalDist = 0;

    // 右键不参与绘制
    if (e.pointerType === "mouse" && e.button === 2) return;

    // 点击 / 轻触爆发
    var hue = hueBase
      + (e.clientX / Math.max(1, W)) * 120
      + (e.clientY / Math.max(1, H)) * 80
      + hueDrift;
    spawn(e.clientX, e.clientY, isMobile ? 5 : 12, 2, hue);
  }, { passive: false });

  canvas.addEventListener("pointermove", function (e) {
    firstInteraction();

    // 触摸设备：只在按下时绘制
    if (e.pointerType === "touch" && !mouse.down) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      return;
    }

    var dx = e.clientX - mouse.x;
    var dy = e.clientY - mouse.y;
    mouse.totalDist += Math.sqrt(dx * dx + dy * dy);
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    if (mouse.totalDist > 500) mouse.totalDist = 500;
  }, { passive: true });

  function endDraw() {
    mouse.down = false;
    mouse.totalDist = 0;
  }

  window.addEventListener("pointerup", endDraw);
  window.addEventListener("pointercancel", endDraw);
  canvas.addEventListener("pointerleave", function () {
    mouse.down = false;
  });

  /* 阻止双指缩放 / 页面滚动 */
  canvas.addEventListener("touchstart", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });

  /* =====================================================
     右键清空
     ===================================================== */
  canvas.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    clearAll();
  });

  function clearAll() {
    particles.length = 0;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#05060c";
    ctx.fillRect(0, 0, W, H);
  }

  /* =====================================================
     滚轮调对称
     ===================================================== */
  window.addEventListener("wheel", function (e) {
    e.preventDefault();
    firstInteraction();
    changeSymmetry(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  /* =====================================================
     控制栏
     ===================================================== */
  function changeSymmetry(delta) {
    var next = Math.max(3, Math.min(24, symmetry + delta));
    if (next === symmetry) return;
    symmetry = next;
    updateSymUI(true);
  }

  if (symDecBtn) symDecBtn.addEventListener("click", function (e) {
    e.preventDefault();
    firstInteraction();
    changeSymmetry(-1);
  });

  if (symIncBtn) symIncBtn.addEventListener("click", function (e) {
    e.preventDefault();
    firstInteraction();
    changeSymmetry(1);
  });

  if (btnPause) btnPause.addEventListener("click", function (e) {
    e.preventDefault();
    firstInteraction();
    paused = !paused;
    setPausedUI();
  });

  if (btnClear) btnClear.addEventListener("click", function (e) {
    e.preventDefault();
    firstInteraction();
    clearAll();
  });

  /* =====================================================
     键盘
     ===================================================== */
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      paused = !paused;
      setPausedUI();
    }
    if (e.key >= "3" && e.key <= "9") {
      symmetry = parseInt(e.key, 10);
      updateSymUI(true);
    }
    if (e.key === "c" || e.key === "C") {
      clearAll();
    }
  });

  /* =====================================================
     初始化
     ===================================================== */
  updateSymUI(false);
  setPausedUI();

  setTimeout(function () {
    if (hintEl) {
      hintEl.style.opacity = "0.18";
      hintEl.style.animation = "none";
    }
  }, 7000);

  document.addEventListener("visibilitychange", function () {
    lastTime = performance.now();
  });

})();
</script>
</body>
</html>
