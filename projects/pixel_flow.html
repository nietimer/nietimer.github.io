<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PixelFlow · 图片节点编辑器</title>
<style>
:root{
  --bg:#09090a;--panel:#131316;--panel-2:#16161a;--panel-3:#1c1c20;
  --border:#26262b;--border-hi:#35353c;--text:#d4d4d8;--text-mid:#9898a3;
  --text-dim:#6e6e78;--accent:#4a7fc9;--accent-hi:#5a8fd9;
  --r:6px;--r-sm:4px;--r-xs:3px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --hl-kw:#c792ea;--hl-str:#c3e88d;--hl-num:#f78c6c;--hl-cmt:#56637a;
  --hl-bi:#82aaff;--hl-img:#ffcb6b;--hl-var:#d4d4d8;
  --hl-line-h:1.6em;
  --hl-pad-y:7px;
  --hl-pad-x:9px;
  --hl-font:10.5px;
  --gutter-w:30px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100dvh;height:100vh}

.topbar{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:#0e0e10;border-bottom:1px solid var(--border);z-index:60;position:relative}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:22px;height:22px;flex-shrink:0;border-radius:4px;background:#1c1c20;
  border:1px solid var(--border-hi);position:relative}
.logo::before,.logo::after{content:'';position:absolute;width:6px;height:6px;border-radius:1px}
.logo::before{top:4px;left:4px;background:#5b92dd}
.logo::after{bottom:4px;right:4px;background:#65b88a}
.brand h1{font-size:13px;font-weight:600;letter-spacing:.01em;color:#e4e4e7;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--text-dim);margin-left:8px;padding-left:8px;
  border-left:1px solid var(--border);white-space:nowrap}
.actions{display:flex;gap:6px;flex-shrink:0}
.btn{height:28px;padding:0 11px;border-radius:5px;border:1px solid var(--border);
  background:#18181c;color:var(--text);font-size:12px;font-weight:500;cursor:pointer;
  transition:background .12s,border-color .12s;font-family:inherit;
  display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#1f1f24;border-color:var(--border-hi)}
.btn:active{background:#252529}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}

main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}

#editor{flex:1;position:relative;overflow:hidden;min-width:0;touch-action:none;
  background-color:#0b0b0d;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:22px 22px;background-position:0 0;cursor:grab}
#editor.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#nodes{position:absolute;left:0;top:0;width:0;height:0}
#wires{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;
  overflow:visible;pointer-events:none;display:block}
#wires path{fill:none;stroke-linecap:round}
#wires .wire-glow{stroke-width:6;opacity:.10}
#wires .wire-core{stroke-width:1.8;opacity:.85}
#wires .wire-temp{stroke-width:1.8;stroke-dasharray:5 4;opacity:.85}
#wires .wire-hit{stroke:transparent;stroke-width:14;pointer-events:stroke;
  cursor:pointer;transition:stroke .1s}
#wires .wire-hit:hover{stroke:rgba(220,80,80,.22)}

.node{position:absolute;left:0;top:0;width:204px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.22);
  user-select:none;will-change:transform;transition:border-color .12s,box-shadow .12s}
.node::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--c);border-radius:var(--r) 0 0 var(--r);opacity:.9;z-index:1}
.node.dragging{border-color:var(--border-hi);
  box-shadow:0 4px 12px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4)}

.node-head{display:flex;align-items:center;gap:7px;padding:7px 8px 7px 12px;
  background:var(--panel-2);border-bottom:1px solid var(--border);
  border-radius:var(--r) var(--r) 0 0;cursor:grab;touch-action:none;
  position:relative;z-index:2}
.node-head:active{cursor:grabbing}
.node-head .ico{font-size:11px;line-height:1;color:var(--c);width:14px;
  text-align:center;flex-shrink:0;opacity:.9}
.node-head .name{flex:1;font-size:11.5px;font-weight:500;letter-spacing:.01em;
  color:#d8d8de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-head .close{width:18px;height:18px;border-radius:3px;border:none;background:transparent;
  color:var(--text-dim);font-size:11px;cursor:pointer;flex-shrink:0;line-height:1;
  transition:background .12s,color .12s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:0}
.node-head .close:hover{background:rgba(200,60,60,.18);color:#e88888}

.node-body{padding:4px 0 8px;position:relative;z-index:2}

.port-row{position:relative;display:flex;align-items:center;min-height:24px;
  padding:0 12px;font-size:10.5px;color:var(--text-dim);letter-spacing:.01em}
.port-row.out{justify-content:flex-end}
.plabel{white-space:nowrap}

.port{position:absolute;width:10px;height:10px;border-radius:50%;
  background:#0d0d0f;border:1.5px solid var(--c);cursor:crosshair;
  transition:transform .12s,background .12s;touch-action:none;z-index:3}
.port.in{left:-5px}
.port.out{right:-5px}
.port::after{content:'';position:absolute;inset:-9px;border-radius:50%}
.port:hover{transform:scale(1.35);background:var(--c)}
.port.invalid{opacity:.2;filter:grayscale(1)}

.port-controls{display:flex;gap:4px;align-items:center;padding:2px 12px 6px}
.pc-label{font-size:9.5px;color:var(--text-dim);letter-spacing:.04em;
  margin-right:auto;text-transform:uppercase;font-weight:600}
.pc-btn{width:22px;height:18px;padding:0;border-radius:var(--r-xs);
  border:1px solid var(--border);background:#18181c;color:var(--text-mid);
  font-size:12px;line-height:1;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,color .12s}
.pc-btn:hover{background:#1f1f24;border-color:var(--border-hi);color:#fff}
.pc-btn:active{background:#252529}
.pc-btn:disabled{opacity:.35;cursor:default}

.script-out-header{display:flex;align-items:center;gap:6px;padding:6px 12px 2px;
  font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-dim);border-top:1px solid var(--border);margin-top:4px}
.script-out-header .count{padding:1px 6px;border-radius:8px;background:#1c1c20;
  border:1px solid var(--border);font-weight:600;color:var(--text-mid);
  font-size:9px;font-variant-numeric:tabular-nums}
.script-out-empty{padding:8px 12px 10px;font-size:10px;color:#4a4a56;
  font-style:italic;letter-spacing:.01em}

.param{padding:4px 12px 3px}
.param-head{display:flex;justify-content:space-between;align-items:center;
  font-size:10.5px;color:var(--text-dim);letter-spacing:.01em;
  margin-bottom:4px;gap:8px}
.param-head > span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param-head .val-input{width:52px;background:#0d0d0f;border:1px solid var(--border);
  border-radius:var(--r-xs);color:var(--text-mid);font-size:10.5px;font-weight:500;
  font-variant-numeric:tabular-nums;padding:2px 5px;text-align:right;
  font-family:inherit;outline:none;transition:border-color .12s,color .12s;flex-shrink:0}
.param-head .val-input:hover{border-color:var(--border-hi);color:var(--text)}
.param-head .val-input:focus{border-color:var(--c);color:#fff}
.param-head .val-input::-webkit-outer-spin-button,
.param-head .val-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.param-head .val-input[type=number]{-moz-appearance:textfield}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;
  background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2a2a30}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:11px;height:11px;border-radius:50%;background:#c8c8ce;margin-top:-4px;
  transition:background .12s}
input[type=range]::-webkit-slider-thumb:hover{background:#fff}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#2a2a30}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
  border:none;background:#c8c8ce}

input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:22px;
  border:none;border-radius:var(--r-xs);background:transparent;cursor:pointer;padding:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:1px solid var(--border-hi);border-radius:var(--r-xs)}
input[type=color]::-moz-color-swatch{border:1px solid var(--border-hi);border-radius:var(--r-xs)}

select{-webkit-appearance:none;appearance:none;width:100%;height:24px;
  padding:0 22px 0 8px;border-radius:var(--r-xs);border:1px solid var(--border);
  background:#0d0d0f;color:var(--text-mid);font-size:10.5px;font-weight:500;
  font-family:inherit;cursor:pointer;outline:none;
  transition:border-color .12s,color .12s;
  background-image:
    linear-gradient(45deg,transparent 50%,#6e6e78 50%),
    linear-gradient(135deg,#6e6e78 50%,transparent 50%);
  background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
select:hover{border-color:var(--border-hi);color:var(--text)}
select:focus{border-color:var(--c);color:#fff}
select option{background:#16161a;color:var(--text)}

.file-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.file-btn{height:24px;padding:0 9px;border-radius:var(--r-xs);
  border:1px solid var(--border-hi);background:#1c1c20;color:#c8c8ce;
  font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;flex-shrink:0;white-space:nowrap}
.file-btn:hover{background:#252529;border-color:#4a4a52;color:#fff}
.file-btn:active{background:#2e2e34}
.file-name{flex:1;min-width:0;font-size:10px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.file-name.ok{color:#65b88a}
.file-name.err{color:#d87878}

/* =========================================================
   卷积核网格
   ========================================================= */
.kernel-grid{
  display:grid;
  gap:3px;
  margin-top:2px;
  padding:0 0 2px;
}
.kernel-cell{
  width:100%;
  min-width:0;
  height:22px;
  padding:0 2px;
  background:#0d0d0f;
  border:1px solid var(--border);
  border-radius:var(--r-xs);
  color:var(--text-mid);
  font-size:10px;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  text-align:center;
  outline:none;
  transition:border-color .12s,color .12s,background .12s;
  -moz-appearance:textfield;
}
.kernel-cell:hover{border-color:var(--border-hi);color:var(--text)}
.kernel-cell:focus{border-color:var(--c);color:#fff;background:#111}
.kernel-cell::-webkit-outer-spin-button,
.kernel-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.kernel-presets{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  padding:5px 0 4px;
}
.kernel-presets button{
  font-size:9.5px;
  font-family:inherit;
  padding:2px 7px;
  border-radius:var(--r-xs);
  border:1px solid var(--border);
  background:#18181c;
  color:var(--text-mid);
  cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
  white-space:nowrap;
  line-height:1.4;
}
.kernel-presets button:hover{
  background:#1f1f24;
  border-color:var(--border-hi);
  color:#e4e4e7;
}
.kernel-presets button:active{background:#252529}

/* =========================================================
   代码编辑器
   ========================================================= */
.code-block{padding:0 0 2px}

.code-editor{
  position:relative;
  width:100%;
  height:168px;
  background:#060608;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  overflow:hidden;
  display:flex;
}
.code-editor:focus-within{
  border-color:var(--c);
  box-shadow:inset 0 0 0 1px var(--c);
}

.code-gutter{
  width:var(--gutter-w);flex-shrink:0;
  background:#0a0a0d;
  border-right:1px solid #1a1a1e;
  overflow:hidden;
  position:relative;
  pointer-events:none;
  user-select:none;
}
.code-gutter-lines{
  padding:var(--hl-pad-y) 0;
  font-family:var(--mono);
  font-size:var(--hl-font);
  line-height:var(--hl-line-h);
  color:#3a4050;
  text-align:right;
  padding-right:7px;
  will-change:transform;
}
.code-gutter-lines .line{
  display:block;
  height:var(--hl-line-h);
  transition:color .1s;
}
.code-gutter-lines .line.active{ color:#82aaff; }

.code-main{position:relative;flex:1;min-width:0;overflow:hidden}

.code-pre,
.code-ta{
  position:absolute;inset:0;margin:0;
  padding:var(--hl-pad-y) var(--hl-pad-x);
  font-family:var(--mono);
  font-size:var(--hl-font);
  line-height:var(--hl-line-h);
  white-space:pre;
  tab-size:2;
  border:none;outline:none;background:transparent;
  word-wrap:normal;overflow-wrap:normal;
  -webkit-text-size-adjust:100%;
}
.code-pre{
  pointer-events:none;
  color:var(--hl-var);
  overflow:hidden;
  z-index:1;
}
.code-pre code{display:block;will-change:transform}
.code-ta{
  color:transparent;
  caret-color:#fff;
  resize:none;
  z-index:2;
  overflow:auto;
  scrollbar-width:thin;
  scrollbar-color:#2a2a30 transparent;
}
.code-ta::-webkit-scrollbar{width:6px;height:6px}
.code-ta::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:3px}
.code-ta::-webkit-scrollbar-thumb:hover{background:#35353c}
.code-ta::-webkit-scrollbar-track{background:transparent}
.code-ta::selection{background:rgba(90,143,217,.35);color:transparent}

.hl-kw  { color:var(--hl-kw); font-weight:500; }
.hl-str { color:var(--hl-str); }
.hl-num { color:var(--hl-num); }
.hl-cmt { color:var(--hl-cmt); font-style:italic; }
.hl-bi  { color:var(--hl-bi); }
.hl-img { color:var(--hl-img); font-weight:500; }

.code-presets{
  display:flex;gap:4px;
  padding:6px 10px 5px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:#0a0a0d;
}
.code-presets button{
  font-size:9.5px;font-family:inherit;
  padding:2px 7px;border-radius:var(--r-xs);
  border:1px solid var(--border);background:#18181c;
  color:var(--text-mid);cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;
  white-space:nowrap;line-height:1.4;
}
.code-presets button:hover{background:#1f1f24;border-color:var(--border-hi);color:#e4e4e7}
.code-presets button:active{background:#252529}

.code-status{
  display:flex;justify-content:flex-end;
  padding:3px 10px 5px;
  font-size:9.5px;color:#3a4050;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  background:#0a0a0d;
  border-bottom:1px solid var(--border);
  min-height:16px;
}
.code-status .pos{ color:#4a4a56; }
.code-status.error .pos{ color:#e88888; }

.code-error{
  margin:6px 10px 8px;padding:6px 8px;
  font-size:9.5px;font-family:var(--mono);
  color:#e88888;background:rgba(200,60,60,.1);
  border:1px solid rgba(200,60,60,.28);border-radius:var(--r-xs);
  white-space:pre-wrap;word-break:break-word;line-height:1.5;
  max-height:60px;overflow-y:auto;display:none;
}
.code-error.show{display:block}

/* =========================================================
   画布节点
   ========================================================= */
.node-canvas{position:relative;margin:6px 10px 8px;border-radius:var(--r-sm);
  background:#060608;overflow:hidden;border:1px solid var(--border)}
.node-canvas canvas{display:block;width:100% !important;height:100% !important;touch-action:none}
.node-canvas .stats-badge{position:absolute;bottom:6px;left:7px;font-size:9.5px;
  letter-spacing:.01em;color:rgba(255,255,255,.55);background:rgba(0,0,0,.55);
  padding:2px 6px;border-radius:var(--r-xs);pointer-events:none;
  font-variant-numeric:tabular-nums;z-index:2}
.node-canvas .empty-msg{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:5px;color:#3a3a44;
  font-size:10.5px;letter-spacing:.02em;pointer-events:none;z-index:1}
.node-canvas .empty-msg .big{font-size:18px;opacity:.5}

.node-canvas .resize-handle{position:absolute;right:0;bottom:0;width:22px;height:22px;
  cursor:nwse-resize;z-index:5;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:4px;color:rgba(255,255,255,.25);touch-action:none;transition:color .12s}
.node-canvas .resize-handle::before{content:'';width:8px;height:8px;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  border-radius:0 0 2px 0}
.node-canvas:hover .resize-handle{color:rgba(255,255,255,.55)}
.node-canvas .resize-handle:hover,.node-canvas .resize-handle:active{color:rgba(120,180,255,.95)}

.node-canvas .size-tip{position:absolute;top:6px;left:7px;font-size:9.5px;
  letter-spacing:.01em;color:rgba(255,255,255,.55);background:rgba(0,0,0,.55);
  padding:2px 6px;border-radius:var(--r-xs);pointer-events:none;
  font-variant-numeric:tabular-nums;z-index:2;opacity:0;transition:opacity .15s}
.node-canvas:hover .size-tip{opacity:1}

/* ★ 导出按钮：与左上角尺寸提示一致，悬停画布区域时显示 */
.node-canvas .export-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:26px;
  height:26px;
  border-radius:var(--r-xs);
  border:1px solid rgba(255,255,255,.12);
  background:rgba(15,15,18,.85);
  color:rgba(255,255,255,.75);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  z-index:6;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s, background .12s, border-color .12s, color .12s;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  font-family:inherit;
}
.node-canvas:hover .export-btn:not(:disabled){
  opacity:1;
  pointer-events:auto;
}
.node-canvas .export-btn:hover:not(:disabled){
  background:rgba(74,127,201,.95);
  border-color:rgba(120,170,255,.9);
  color:#fff;
}
.node-canvas .export-btn:active:not(:disabled){
  background:rgba(74,127,201,1);
  transform:scale(.94);
}
.node-canvas .export-btn svg{
  width:13px;
  height:13px;
  display:block;
}

.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);
  padding:5px 11px;border-radius:var(--r-sm);background:#131316;
  border:1px solid var(--border);font-size:10.5px;color:var(--text-dim);
  letter-spacing:.01em;pointer-events:none;white-space:nowrap;
  transition:opacity .5s;z-index:20}
.hint.hide{opacity:0}

.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;
  gap:0;z-index:30;border:1px solid var(--border);border-radius:var(--r);
  background:#131316;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.zoomctl button{width:32px;height:32px;border:none;background:transparent;
  color:var(--text-mid);cursor:pointer;transition:background .1s,color .1s;
  display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.zoomctl button:not(:last-child){border-bottom:1px solid var(--border)}
.zoomctl button:hover{background:#1f1f24;color:#e4e4e7}
.zoomctl button:active{background:#26262b}

<script>
/* =========================================================
   基础工具
   ========================================================= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

const editorEl   = $('editor');
const worldEl    = $('world');
const nodesLayer = $('nodes');
const wiresEl    = $('wires');
const palette    = $('palette');
const fabAdd     = $('fabAdd');
const hintEl     = $('hint');

const SVG_NS = 'http://www.w3.org/2000/svg';

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}
function copyCanvas(src) {
  const c = newCanvas(src.width, src.height);
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

const CATS = {
  source:    { color:'#5b92dd', label:'图像源' },
  filter:    { color:'#9a8ae0', label:'滤镜' },
  transform: { color:'#d9a04f', label:'变换' },
  output:    { color:'#65b88a', label:'输出' },
};

const CANVAS_DEF_W = 220;
const CANVAS_DEF_H = 165;
const CANVAS_MIN_W = 130;
const CANVAS_MIN_H = 100;
const CANVAS_MAX_W = 900;
const CANVAS_MAX_H = 700;

const SCRIPT_MAX_INPUTS = 8;

/* =========================================================
   卷积核工具
   ========================================================= */
function makeMeanKernel(size) {
  return new Array(size * size).fill(1);
}
function resizeKernel(oldKernel, oldSize, newSize) {
  const newKernel = new Array(newSize * newSize).fill(0);
  if (!Array.isArray(oldKernel) || oldKernel.length !== oldSize * oldSize) {
    return makeMeanKernel(newSize);
  }
  const half = Math.floor((newSize - oldSize) / 2);
  for (let y = 0; y < oldSize; y++) {
    for (let x = 0; x < oldSize; x++) {
      const nx = x + half;
      const ny = y + half;
      if (nx >= 0 && nx < newSize && ny >= 0 && ny < newSize) {
        newKernel[ny * newSize + nx] = oldKernel[y * oldSize + x];
      }
    }
  }
  return newKernel;
}
function fmtKernelNum(v) {
  if (typeof v !== 'number' || isNaN(v)) return '0';
  if (Number.isInteger(v)) return String(v);
  return parseFloat(v.toFixed(3)).toString();
}

const KERNEL_PRESETS = [
  { label: '模糊',  size: 3, kernel: [1,1,1, 1,1,1, 1,1,1], div: 9 },
  { label: '高斯',  size: 3, kernel: [1,2,1, 2,4,2, 1,2,1], div: 16 },
  { label: '锐化',  size: 3, kernel: [0,-1,0, -1,5,-1, 0,-1,0], div: 1 },
  { label: '边缘',  size: 3, kernel: [-1,-1,-1, -1,8,-1, -1,-1,-1], div: 1 },
  { label: '浮雕',  size: 3, kernel: [-2,-1,0, -1,1,1, 0,1,2], div: 1 },
  { label: '拉普拉斯', size: 3, kernel: [0,-1,0, -1,4,-1, 0,-1,0], div: 1 },
];

/* =========================================================
   ScriptImage
   ========================================================= */
class ScriptImage {
  constructor(w, h, data) {
    this.w = w;
    this.h = h;
    this._data = data;
  }
  get(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return { r:0, g:0, b:0, a:0 };
    const i = (y * this.w + x) * 4;
    return { r: this._data[i], g: this._data[i+1], b: this._data[i+2], a: this._data[i+3] };
  }
  set(x, y, r, g, b, a) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = (y * this.w + x) * 4;
    this._data[i]     = r;
    this._data[i + 1] = g;
    this._data[i + 2] = b;
    this._data[i + 3] = (a === undefined) ? 255 : a;
  }
  each(fn) {
    const w = this.w, h = this.h, data = this._data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const res = fn(data[i], data[i+1], data[i+2], data[i+3], x, y);
        if (res && res.length === 4) {
          data[i]     = res[0];
          data[i+1]   = res[1];
          data[i+2]   = res[2];
          data[i+3]   = res[3];
        }
      }
    }
    return this;
  }
  clone() {
    return new ScriptImage(this.w, this.h, new Uint8ClampedArray(this._data));
  }
}

function $createImage(w, h) {
  w = Math.max(1, Math.floor(w));
  h = Math.max(1, Math.floor(h));
  return new ScriptImage(w, h, new Uint8ClampedArray(w * h * 4));
}
function $cloneImage(img) {
  if (!img || !img._data) return null;
  return new ScriptImage(img.w, img.h, new Uint8ClampedArray(img._data));
}
function canvasToScriptImage(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, w, h);
  return new ScriptImage(w, h, imgData.data);
}
function scriptImageToCanvas(img) {
  const c = newCanvas(img.w, img.h);
  const ctx = c.getContext('2d');
  const imgData = ctx.createImageData(img.w, img.h);
  imgData.data.set(img._data);
  ctx.putImageData(imgData, 0, 0);
  return c;
}

/* =========================================================
   脚本编译
   ========================================================= */
const compileCache = new Map();
const MAX_CACHE = 40;

function compileScript(code, inputCount) {
  const key = inputCount + '::' + code;
  if (compileCache.has(key)) return compileCache.get(key);

  const paramNames = ['createImage', 'cloneImage'];
  for (let i = 1; i <= inputCount; i++) paramNames.push('img' + i);

  const wrapped = '"use strict";\n' + code;

  let entry;
  try {
    const fn = new Function(...paramNames, wrapped);
    entry = { fn, error: null };
  } catch (e) {
    entry = { fn: null, error: e.message };
  }

  if (compileCache.size > MAX_CACHE) {
    const firstKey = compileCache.keys().next().value;
    compileCache.delete(firstKey);
  }
  compileCache.set(key, entry);
  return entry;
}

/* =========================================================
   默认脚本 & 预设
   ========================================================= */
const SCRIPT_DEFAULT =
`// ===== 像素脚本 =====
// 输入：img1, img2, ...（每张图提供 w/h 与 get/set/each/clone）
// 输出：return 一张图像 或 return [imgA, imgB, ...] 多路输出

const out = cloneImage(img1);

out.each((r, g, b, a) => [255 - r, 255 - g, 255 - b, a]);

return out;
`;

const SCRIPT_PRESETS = {
  invert: {
    label: '反转',
    code:
`const out = cloneImage(img1);
out.each((r, g, b, a) => [255 - r, 255 - g, 255 - b, a]);
return out;
`,
  },
  gray: {
    label: '灰度',
    code:
`const out = cloneImage(img1);
out.each((r, g, b, a) => {
  const L = 0.299 * r + 0.587 * g + 0.114 * b;
  return [L, L, L, a];
});
return out;
`,
  },
  noise: {
    label: '噪点',
    code:
`const out = cloneImage(img1);
out.each((r, g, b, a) => {
  const n = (Math.random() - 0.5) * 55;
  return [
    Math.max(0, Math.min(255, r + n)),
    Math.max(0, Math.min(255, g + n)),
    Math.max(0, Math.min(255, b + n)),
    a,
  ];
});
return out;
`,
  },
  blend2: {
    label: '融合两张图',
    code:
`// 需要先添加第 2 个图像输入
// 逐像素正向融合：img1 第 i 个像素 与 img2 第 i 个像素
if (!img2) return img1;

const w = img1.w, h = img1.h;
const out = createImage(w, h);

for (let y = 0; y < h; y++) {
  for (let x = 0; x < w; x++) {
    const p1 = img1.get(x, y);
    const p2 = img2.get(x, y);
    out.set(x, y,
      (p1.r + p2.r) * 0.5,
      (p1.g + p2.g) * 0.5,
      (p1.b + p2.b) * 0.5,
      255);
  }
}

return out;
`,
  },
  multi: {
    label: '多输出',
    code:
`// 输出 3 张：原图 / 反相 / 灰度
const inv = cloneImage(img1);
const gry = cloneImage(img1);

inv.each((r, g, b, a) => [255 - r, 255 - g, 255 - b, a]);

gry.each((r, g, b, a) => {
  const L = 0.299 * r + 0.587 * g + 0.114 * b;
  return [L, L, L, a];
});

return [img1, inv, gry];
`,
  },
  vignette: {
    label: '暗角',
    code:
`const w = img1.w, h = img1.h;
const out = cloneImage(img1);

out.each((r, g, b, a, x, y) => {
  const dx = x / w - 0.5;
  const dy = y / h - 0.5;
  const d = Math.sqrt(dx * dx + dy * dy) * 1.7;
  const f = Math.max(0, Math.min(1, 1 - d * d));
  return [r * f, g * f, b * f, a];
});
return out;
`,
  },
  stripe: {
    label: '扫描线',
    code:
`const out = cloneImage(img1);
out.each((r, g, b, a, x, y) => {
  const f = (y % 4 === 0) ? 0.7 : 1;
  return [r * f, g * f, b * f, a];
});
return out;
`,
  },
};

/* =========================================================
   语法高亮
   ========================================================= */
const HL_KEYWORDS = new Set([
  'const','let','var','function','return','if','else','for','while','do',
  'break','continue','new','typeof','instanceof','null','undefined','true',
  'false','this','in','of','switch','case','default','try','catch','finally',
  'throw','class','extends','super','yield','await','async','delete','void',
  'with','debugger','export','import','from','static','get','set',
]);
const HL_BUILTINS = new Set([
  'Math','console','JSON','Number','String','Boolean','Array','Object',
  'Date','RegExp','Map','Set','Promise','parseInt','parseFloat','isNaN',
  'isFinite','Infinity','NaN','Uint8ClampedArray','Uint8Array','Float32Array',
  'createImage','cloneImage','ScriptImage',
]);

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightJS(code) {
  let out = '';
  let i = 0;
  const len = code.length;

  while (i < len) {
    const ch = code[i];
    const nx = code[i + 1];

    if (ch === '/' && nx === '/') {
      let j = i;
      while (j < len && code[j] !== '\n') j++;
      out += `<span class="hl-cmt">${escHtml(code.slice(i, j))}</span>`;
      i = j;
      continue;
    }
    if (ch === '/' && nx === '*') {
      let j = i + 2;
      while (j < len && !(code[j] === '*' && code[j + 1] === '/')) j++;
      j = Math.min(j + 2, len);
      out += `<span class="hl-cmt">${escHtml(code.slice(i, j))}</span>`;
      i = j;
      continue;
    }
    if (ch === '"' || ch === "'" || ch === '`') {
      const q = ch;
      let j = i + 1;
      while (j < len) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === q) { j++; break; }
        if (q === '`' && code[j] === '\n') break;
        j++;
      }
      out += `<span class="hl-str">${escHtml(code.slice(i, j))}</span>`;
      i = j;
      continue;
    }
    if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(nx))) {
      let j = i;
      while (j < len) {
        const c = code[j];
        if (/[0-9]/.test(c)) { j++; continue; }
        if (c === '.' && /[0-9]/.test(code[j + 1])) { j++; continue; }
        if ((c === 'e' || c === 'E') &&
            (/[0-9]/.test(code[j + 1]) ||
             ((code[j + 1] === '+' || code[j + 1] === '-') && /[0-9]/.test(code[j + 2])))) {
          j += (code[j + 1] === '+' || code[j + 1] === '-') ? 2 : 1;
          continue;
        }
        break;
      }
      out += `<span class="hl-num">${escHtml(code.slice(i, j))}</span>`;
      i = j;
      continue;
    }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i;
      while (j < len && /[A-Za-z0-9_$]/.test(code[j])) j++;
      const word = code.slice(i, j);
      const e = escHtml(word);
      if (HL_KEYWORDS.has(word)) out += `<span class="hl-kw">${e}</span>`;
      else if (HL_BUILTINS.has(word)) out += `<span class="hl-bi">${e}</span>`;
      else if (/^img\d+$/.test(word)) out += `<span class="hl-img">${e}</span>`;
      else out += e;
      i = j;
      continue;
    }
    out += escHtml(ch);
    i++;
  }
  return out;
}

/* =========================================================
   代码编辑器组件
   ========================================================= */
function createCodeEditor(node, paramKey, onCommit) {
  const wrap = document.createElement('div');
  wrap.className = 'code-block';

  const editor = document.createElement('div');
  editor.className = 'code-editor';

  const gutter = document.createElement('div');
  gutter.className = 'code-gutter';
  const gutterLines = document.createElement('div');
  gutterLines.className = 'code-gutter-lines';
  gutter.appendChild(gutterLines);

  const main = document.createElement('div');
  main.className = 'code-main';

  const pre = document.createElement('pre');
  pre.className = 'code-pre';
  const codeEl = document.createElement('code');
  codeEl.className = 'code-content';
  pre.appendChild(codeEl);

  const ta = document.createElement('textarea');
  ta.className = 'code-ta';
  ta.spellcheck = false;
  ta.value = node.params[paramKey] || '';

  main.appendChild(pre);
  main.appendChild(ta);

  editor.appendChild(gutter);
  editor.appendChild(main);

  const status = document.createElement('div');
  status.className = 'code-status';
  status.innerHTML = `<span class="pos">1:1</span>`;
  const posEl = status.querySelector('.pos');

  let lineCount = 0;
  let activeLine = -1;
  let lineEls = [];

  const updateLineNumbers = () => {
    const lines = ta.value.split('\n').length;
    if (lines !== lineCount) {
      if (lines > lineEls.length) {
        const frag = document.createDocumentFragment();
        for (let i = lineEls.length; i < lines; i++) {
          const s = document.createElement('span');
          s.className = 'line';
          s.textContent = i + 1;
          frag.appendChild(s);
          lineEls.push(s);
        }
        gutterLines.appendChild(frag);
      } else if (lines < lineEls.length) {
        for (let i = lines; i < lineEls.length; i++) {
          lineEls[i].remove();
        }
        lineEls.length = lines;
      }
      lineCount = lines;
    }
  };

  const updateActiveLine = () => {
    const pos = ta.selectionStart;
    let line = 0;
    for (let i = 0; i < pos; i++) {
      if (ta.value.charCodeAt(i) === 10) line++;
    }
    if (line === activeLine) return;
    if (lineEls[activeLine]) lineEls[activeLine].classList.remove('active');
    if (lineEls[line]) lineEls[line].classList.add('active');
    activeLine = line;

    const col = pos - (ta.value.lastIndexOf('\n', pos - 1) + 1);
    posEl.textContent = `${line + 1}:${col + 1}`;
  };

  const syncScroll = () => {
    const st = ta.scrollTop;
    const sl = ta.scrollLeft;
    gutterLines.style.transform = `translateY(${-st}px)`;
    codeEl.style.transform = `translate(${-sl}px, ${-st}px)`;
  };

  let hlTimer = null;
  const updateHighlight = () => {
    codeEl.innerHTML = highlightJS(ta.value) + '\n';
    codeEl.style.transform = 'none';
    syncScroll();
  };

  const refresh = () => {
    updateLineNumbers();
    updateHighlight();
    updateActiveLine();
  };

  let commitTimer = null;
  const commitValue = () => {
    if (node.params[paramKey] === ta.value) return;
    node.params[paramKey] = ta.value;
    if (onCommit) onCommit();
  };
  const scheduleCommit = () => {
    clearTimeout(commitTimer);
    commitTimer = setTimeout(commitValue, 450);
  };

  ta.addEventListener('scroll', () => { syncScroll(); }, { passive: true });

  ta.addEventListener('pointerdown', e => e.stopPropagation());
  main.addEventListener('pointerdown', e => {
    if (e.target === main || e.target === pre || e.target === codeEl) {
      e.stopPropagation();
      ta.focus();
      const rect = ta.getBoundingClientRect();
      const y = e.clientY - rect.top + ta.scrollTop;
      const lineH = parseFloat(getComputedStyle(ta).lineHeight);
      const padY = parseFloat(getComputedStyle(ta).paddingTop);
      const line = Math.floor((y - padY) / lineH);
      const totalLines = ta.value.split('\n').length;
      const targetLine = Math.max(0, Math.min(line, totalLines - 1));
      const lines = ta.value.split('\n');
      let pos = 0;
      for (let i = 0; i < targetLine; i++) pos += lines[i].length + 1;
      ta.selectionStart = ta.selectionEnd = pos;
      updateActiveLine();
    }
  });

  ta.addEventListener('input', () => {
    updateLineNumbers();
    clearTimeout(hlTimer);
    hlTimer = setTimeout(updateHighlight, 30);
    updateActiveLine();
    scheduleCommit();
  });

  const onSelectUpdate = () => updateActiveLine();
  ta.addEventListener('click', onSelectUpdate);
  ta.addEventListener('keyup', onSelectUpdate);
  ta.addEventListener('select', onSelectUpdate);

  ta.addEventListener('blur', () => {
    clearTimeout(commitTimer);
    commitValue();
    clearTimeout(hlTimer);
    updateHighlight();
  });

  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const value = ta.value;

      if (start === end) {
        if (e.shiftKey) {
          const lineStart = value.lastIndexOf('\n', start - 1) + 1;
          const lineEnd = value.indexOf('\n', start);
          const lineEndPos = lineEnd === -1 ? value.length : lineEnd;
          const line = value.slice(lineStart, lineEndPos);
          const m = line.match(/^ {1,2}/);
          if (m) {
            const len = m[0].length;
            ta.value = value.slice(0, lineStart) + line.slice(len) + value.slice(lineEndPos);
            ta.selectionStart = ta.selectionEnd = Math.max(lineStart, start - len);
            refresh();
            scheduleCommit();
          }
        } else {
          ta.value = value.slice(0, start) + '  ' + value.slice(end);
          ta.selectionStart = ta.selectionEnd = start + 2;
          refresh();
          scheduleCommit();
        }
      } else {
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = value.indexOf('\n', end);
        if (lineEnd === -1) lineEnd = value.length;
        const block = value.slice(lineStart, lineEnd);
        const lines = block.split('\n');
        let newLines;
        if (e.shiftKey) {
          newLines = lines.map(l => {
            const m = l.match(/^ {1,2}/);
            return m ? l.slice(m[0].length) : l;
          });
        } else {
          newLines = lines.map(l => '  ' + l);
        }
        const newBlock = newLines.join('\n');
        ta.value = value.slice(0, lineStart) + newBlock + value.slice(lineEnd);
        ta.selectionStart = lineStart;
        ta.selectionEnd = lineStart + newBlock.length;
        refresh();
        scheduleCommit();
      }
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      if (start !== end) return;
      const value = ta.value;
      const lineStart = value.lastIndexOf('\n', start - 1) + 1;
      const currentLine = value.slice(lineStart, start);
      const indentMatch = currentLine.match(/^[ \t]*/);
      let indent = indentMatch ? indentMatch[0] : '';

      const before = value.slice(0, start);
      const after = value.slice(end);
      const lastChar = before[before.length - 1];
      const nextChar = after[0];

      let extraIndent = '';
      if (lastChar === '{' || lastChar === '(' || lastChar === '[') {
        extraIndent = '  ';
      }

      let trimIndent = '';
      if (nextChar === '}' || nextChar === ')' || nextChar === ']') {
        if (indent.endsWith('  ')) trimIndent = indent.slice(0, -2);
        else trimIndent = indent;
      }

      const newLineIndent = indent + extraIndent;

      if (trimIndent) {
        e.preventDefault();
        const insert = '\n' + trimIndent + '\n' + trimIndent;
        ta.value = before + insert + after;
        ta.selectionStart = ta.selectionEnd = start + 1 + trimIndent.length;
      } else {
        e.preventDefault();
        const insert = '\n' + newLineIndent;
        ta.value = before + insert + after;
        ta.selectionStart = ta.selectionEnd = start + insert.length;
      }
      refresh();
      scheduleCommit();
      return;
    }

    const pairs = { '(':')', '[':']', '{':'}', '"':'"', "'":"'", '`':'`' };
    if (pairs[e.key]) {
      const close = pairs[e.key];
      const start = ta.selectionStart;
      const end = ta.selectionEnd;

      if (start !== end) {
        e.preventDefault();
        const sel = ta.value.slice(start, end);
        ta.value = ta.value.slice(0, start) + e.key + sel + close + ta.value.slice(end);
        ta.selectionStart = start + 1;
        ta.selectionEnd = end + 1;
        refresh();
        scheduleCommit();
        return;
      }

      const next = ta.value[start] || '';
      if (e.key === '"' || e.key === "'" || e.key === '`') {
        if (next === e.key) {
          e.preventDefault();
          ta.selectionStart = ta.selectionEnd = start + 1;
          updateActiveLine();
          return;
        }
        const prev = ta.value[start - 1] || '';
        if (/[A-Za-z0-9_$]/.test(prev)) return;
        if (/[A-Za-z0-9_$]/.test(next)) return;
      }
      if (close === ')' && next === ')') {
        e.preventDefault();
        ta.selectionStart = ta.selectionEnd = start + 1;
        updateActiveLine();
        return;
      }
      if (close === ']' && next === ']') {
        e.preventDefault();
        ta.selectionStart = ta.selectionEnd = start + 1;
        updateActiveLine();
        return;
      }
      if (close === '}' && next === '}') {
        e.preventDefault();
        ta.selectionStart = ta.selectionEnd = start + 1;
        updateActiveLine();
        return;
      }

      e.preventDefault();
      ta.value = ta.value.slice(0, start) + e.key + close + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 1;
      refresh();
      scheduleCommit();
      return;
    }

    const closers = { ')':'(' , ']':'[' , '}':'{' };
    if (closers[e.key]) {
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      if (start === end && ta.value[start] === e.key) {
        e.preventDefault();
        ta.selectionStart = ta.selectionEnd = start + 1;
        updateActiveLine();
        return;
      }
    }

    if (e.key === 'Backspace') {
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      if (start !== end) return;
      if (start === 0) return;
      const prevChar = ta.value[start - 1];
      const nextChar = ta.value[start];
      const pairs2 = { '(':')', '[':']', '{':'}', '"':'"', "'":"'", '`':'`' };
      if (pairs2[prevChar] && pairs2[prevChar] === nextChar) {
        e.preventDefault();
        ta.value = ta.value.slice(0, start - 1) + ta.value.slice(start + 1);
        ta.selectionStart = ta.selectionEnd = start - 1;
        refresh();
        scheduleCommit();
        return;
      }
    }
  });

  const presetRow = document.createElement('div');
  presetRow.className = 'code-presets';
  Object.entries(SCRIPT_PRESETS).forEach(([k, preset]) => {
    const pb = document.createElement('button');
    pb.type = 'button';
    pb.textContent = preset.label;
    pb.addEventListener('pointerdown', e => e.stopPropagation());
    pb.addEventListener('click', e => {
      e.stopPropagation();
      ta.value = preset.code;
      refresh();
      clearTimeout(commitTimer);
      commitValue();
    });
    presetRow.appendChild(pb);
  });

  const errEl = document.createElement('div');
  errEl.className = 'code-error';

  wrap.appendChild(presetRow);
  wrap.appendChild(editor);
  wrap.appendChild(status);
  wrap.appendChild(errEl);

  wrap._setError = (msg) => {
    if (msg) {
      if (errEl.textContent !== msg) errEl.textContent = msg;
      errEl.classList.add('show');
      status.classList.add('error');
    } else {
      errEl.classList.remove('show');
      errEl.textContent = '';
      status.classList.remove('error');
    }
  };
  wrap._getTextarea = () => ta;
  wrap._refreshAll = () => { refresh(); };

  requestAnimationFrame(() => {
    refresh();
    syncScroll();
  });

  return wrap;
}

  threshold: {
    label:'阈值', cat:'filter', icon:'◪',
    inputs: [{ name:'in', label:'图像', type:'img' }],
    outputs: [{ name:'out', label:'图像', type:'img' }],
    params: [
      { key:'level', label:'阈值',   type:'range', min:0, max:255, step:1, value:128 },
      { key:'c1',    label:'暗部色', type:'color', value:'#000000' },
      { key:'c2',    label:'亮部色', type:'color', value:'#ffffff' },
    ],
    eval(node, inputs) {
      const src = inputs.in;
      if (!src) return null;
      const c = newCanvas(src.width, src.height);
      const ctx = c.getContext('2d');
      ctx.drawImage(src, 0, 0);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const data = imgData.data;
      const lvl = node.params.level;
      const dark  = hexToRgb(node.params.c1);
      const light = hexToRgb(node.params.c2);
      for (let i = 0; i < data.length; i += 4) {
        const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        if (lum < lvl) {
          data[i] = dark.r; data[i+1] = dark.g; data[i+2] = dark.b;
        } else {
          data[i] = light.r; data[i+1] = light.g; data[i+2] = light.b;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return c;
    },
  },
  pixelate: {
    label:'像素化', cat:'filter', icon:'▦',
    inputs: [{ name:'in', label:'图像', type:'img' }],
    outputs: [{ name:'out', label:'图像', type:'img' }],
    params: [{ key:'size', label:'像素块', type:'range', min:2, max:64, step:1, value:12, unit:'px' }],
