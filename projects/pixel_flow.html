      const tmp = newCanvas(sw, sh);
      tmp.getContext('2d').drawImage(src, 0, 0, sw, sh);
      const c = newCanvas(src.width, src.height);
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, sw, sh, 0, 0, c.width, c.height);
      return c;
    },
  },

  /* =====================================================
     卷积节点
     ===================================================== */
  convolve: {
    label:'卷积', cat:'filter', icon:'⊞',
    inputs: [{ name:'in', label:'图像', type:'img' }],
    outputs: [{ name:'out', label:'图像', type:'img' }],
    params: [
      { key:'ksize', label:'核大小', type:'select', value:'3', options:[
        ['3','3 × 3'], ['5','5 × 5'], ['7','7 × 7'],
      ]},
      { key:'kernel', label:'卷积核', type:'kernel', value: null },
      { key:'kdiv',  label:'除数',   type:'range', min:-32, max:32, step:0.1, value:9 },
      { key:'kbias', label:'偏置',   type:'range', min:-128, max:128, step:1, value:0 },
      { key:'kedge', label:'边界处理', type:'select', value:'clamp', options:[
        ['clamp','夹紧'], ['mirror','镜像'], ['wrap','环绕'],
      ]},
    ],
    eval(node, inputs) {
      const src = inputs.in;
      if (!src) return null;

      const size    = parseInt(node.params.ksize, 10) || 3;
      const kernel  = Array.isArray(node.params.kernel) ? node.params.kernel : [];
      const divisor = node.params.kdiv;
      const bias    = node.params.kbias;
      const edge    = node.params.kedge;

      const w = src.width, h = src.height;
      const srcCtx = src.getContext('2d');
      const srcData = srcCtx.getImageData(0, 0, w, h).data;

      const dst = newCanvas(w, h);
      const dstCtx = dst.getContext('2d');
      const dstImg = dstCtx.createImageData(w, h);
      const dstData = dstImg.data;

      const half = Math.floor(size / 2);
      const dv = (divisor === 0 || !isFinite(divisor)) ? 1 : divisor;

      const clampIdx = (v, max) => v < 0 ? 0 : v >= max ? max - 1 : v;
      const wrapIdx  = (v, max) => ((v % max) + max) % max;
      const mirrorIdx = (v, max) => {
        if (max <= 1) return 0;
        let r = v;
        while (r < 0 || r >= max) {
          if (r < 0) r = -r;
          if (r >= max) r = 2 * max - 2 - r;
        }
        return r;
      };

      let getIdx;
      if (edge === 'wrap')        getIdx = wrapIdx;
      else if (edge === 'mirror') getIdx = mirrorIdx;
      else                        getIdx = clampIdx;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let r = 0, g = 0, b = 0;

          for (let ky = 0; ky < size; ky++) {
            const sy = getIdx(y + ky - half, h);
            const rowOff = sy * w;
            const kRowOff = ky * size;
            for (let kx = 0; kx < size; kx++) {
              const sx = getIdx(x + kx - half, w);
              const si = (rowOff + sx) * 4;
              const kv = kernel[kRowOff + kx] || 0;
              r += srcData[si]     * kv;
              g += srcData[si + 1] * kv;
              b += srcData[si + 2] * kv;
            }
          }

          const di = (y * w + x) * 4;
          dstData[di]     = r / dv + bias;
          dstData[di + 1] = g / dv + bias;
          dstData[di + 2] = b / dv + bias;
          dstData[di + 3] = srcData[di + 3];
        }
      }

      dstCtx.putImageData(dstImg, 0, 0);
      return dst;
    },
  },

  pixelScript: {
    label:'像素脚本', cat:'filter', icon:'⌘',
    dynamicInputs: true,
    dynamicOutputs: true,
    inputs: [],
    outputs: [],
    params: [
      { key:'script', label:'脚本', type:'code', value: SCRIPT_DEFAULT },
    ],
    eval(node, inputs) {
      const code = node.params.script || '';
      const inputCount = node.inputCount || 1;

      const inputImages = [];
      for (let i = 1; i <= inputCount; i++) {
        const canvas = inputs['img' + i];
        inputImages.push(canvas ? canvasToScriptImage(canvas) : null);
      }

      const { fn, error } = compileScript(code, inputCount);
      if (error) {
        setScriptError(node.id, '编译错误：' + error);
        return null;
      }

      let result;
      try {
        result = fn($createImage, $cloneImage, ...inputImages);
      } catch (e) {
        setScriptError(node.id, '运行错误：' + e.message);
        return null;
      }

      setScriptError(node.id, null);

      if (!result) return null;

      const arr = Array.isArray(result) ? result : [result];
      const canvases = [];
      for (const r of arr) {
        if (r instanceof ScriptImage) {
          canvases.push(scriptImageToCanvas(r));
        } else if (r && typeof r.width === 'number' && typeof r.height === 'number'
                   && r.getContext) {
          canvases.push(r);
        }
      }

      return canvases.length ? canvases : null;
    },
  },

  transform: {
    label:'变换', cat:'transform', icon:'⌗',
    inputs: [{ name:'in', label:'图像', type:'img' }],
    outputs: [{ name:'out', label:'图像', type:'img' }],
    params: [
      { key:'scale',  label:'缩放', type:'range', min:10,  max:300, step:1, value:100, unit:'%' },
      { key:'rotate', label:'旋转', type:'range', min:-180, max:180, step:1, value:0,   unit:'°' },
      { key:'flip',   label:'翻转', type:'select', value:'none', options:[
        ['none','不翻转'],['h','水平翻转'],['v','垂直翻转'],['hv','双向翻转'],
      ]},
    ],
    eval(node, inputs) {
      const src = inputs.in;
      if (!src) return null;
      const p = node.params;
      const s = p.scale / 100;
      const ang = p.rotate * Math.PI / 180;
      const w = src.width, h = src.height;
      const cos = Math.abs(Math.cos(ang)), sin = Math.abs(Math.sin(ang));
      const nw = Math.max(1, Math.ceil((w * cos + h * sin) * s));
      const nh = Math.max(1, Math.ceil((w * sin + h * cos) * s));
      const c = newCanvas(nw, nh);
      const ctx = c.getContext('2d');
      ctx.translate(nw / 2, nh / 2);
      if (p.flip === 'h' || p.flip === 'hv') ctx.scale(-1, 1);
      if (p.flip === 'v' || p.flip === 'hv') ctx.scale(1, -1);
      ctx.rotate(ang);
      ctx.scale(s, s);
      ctx.drawImage(src, -w / 2, -h / 2);
      return c;
    },
  },
  blend: {
    label:'混合', cat:'transform', icon:'✦',
    inputs: [
      { name:'a', label:'底图 A', type:'img' },
      { name:'b', label:'叠加 B', type:'img' },
    ],
    outputs: [{ name:'out', label:'图像', type:'img' }],
    params: [
      { key:'mode', label:'混合模式', type:'select', value:'source-over', options: [
        ['source-over','正常'], ['multiply','正片叠底'], ['screen','滤色'],
        ['overlay','叠加'], ['difference','差值'], ['lighten','变亮'], ['darken','变暗'],
      ]},
      { key:'alpha', label:'不透明度', type:'range', min:0, max:100, step:1, value:100, unit:'%' },
    ],
    eval(node, inputs) {
      const a = inputs.a, b = inputs.b;
      if (!a && !b) return null;
      if (!a) return copyCanvas(b);
      if (!b) return copyCanvas(a);
      const c = newCanvas(a.width, a.height);
      const ctx = c.getContext('2d');
      ctx.drawImage(a, 0, 0);
      ctx.globalCompositeOperation = node.params.mode;
      ctx.globalAlpha = node.params.alpha / 100;
      ctx.drawImage(b, 0, 0, a.width, a.height);
      return c;
    },
  },
  output: {
    label:'画布输出', cat:'output', icon:'▢',
    inputs: [{ name:'in', label:'图像', type:'img' }],
    outputs: [],
    params: [],
    eval(node, inputs) { return inputs.in || null; },
  },
};

/* =========================================================
   状态
   ========================================================= */
let nodes = [];
let edges = [];
let uid = 0;
const nodeEls = new Map();
const canvasNodeData = new Map();

let panX = 60, panY = 60, scale = 1;

/* =========================================================
   单个输出节点导出
   ========================================================= */
function exportNodeOutput(nodeId) {
  const data = canvasNodeData.get(nodeId);
  const result = data && data._lastResult;
  if (!result || !result.width) {
    alert('该输出节点没有图像');
    return;
  }
  result.toBlob(blob => {
    const ts = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp =
      ts.getFullYear() +
      pad(ts.getMonth() + 1) +
      pad(ts.getDate()) + '-' +
      pad(ts.getHours()) +
      pad(ts.getMinutes()) +
      pad(ts.getSeconds());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pixelflow-${stamp}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
}

/* =========================================================
   脚本错误回显
   ========================================================= */
const pendingErrors = new Map();
let errFlushScheduled = false;

function setScriptError(nodeId, msg) {
  pendingErrors.set(nodeId, msg || null);
  if (errFlushScheduled) return;
  errFlushScheduled = true;
  requestAnimationFrame(() => {
    errFlushScheduled = false;
    for (const [id, m] of pendingErrors) {
      const el = nodeEls.get(id);
      if (!el) continue;
      const codeBlock = el.querySelector('.code-block');
      if (codeBlock && codeBlock._setError) {
        codeBlock._setError(m);
      } else {
        const errEl = el.querySelector('.code-error');
        if (!errEl) continue;
        if (m) {
          if (errEl.textContent !== m) errEl.textContent = m;
          errEl.classList.add('show');
        } else {
          errEl.classList.remove('show');
          errEl.textContent = '';
        }
      }
    }
    pendingErrors.clear();
  });
}

/* =========================================================
   求值引擎
   ========================================================= */
function evaluate(nodeId, cache, stack) {
  if (cache.has(nodeId)) return cache.get(nodeId);
  if (stack.has(nodeId)) return null;
  stack.add(nodeId);

  const node = nodes.find(n => n.id === nodeId);
  if (!node) { stack.delete(nodeId); return null; }

  const def = DEFS[node.type];
  const inputs = {};

  if (def.dynamicInputs) {
    const n = node.inputCount || 1;
    for (let i = 1; i <= n; i++) {
      const key = 'img' + i;
      const edge = edges.find(e => e.to.node === nodeId && e.to.port === key);
      inputs[key] = edge
        ? resolvePort(edge.from.node, edge.from.port, cache, stack)
        : null;
    }
  } else {
    for (const inp of def.inputs) {
      const edge = edges.find(e => e.to.node === nodeId && e.to.port === inp.name);
      inputs[inp.name] = edge
        ? resolvePort(edge.from.node, edge.from.port, cache, stack)
        : null;
    }
  }

  let out = null;
  try { out = def.eval(node, inputs) || null; }
  catch (err) { console.warn('节点求值失败:', node.type, err); }

  stack.delete(nodeId);
  cache.set(nodeId, out);
  return out;
}

function resolvePort(nodeId, portName, cache, stack) {
  const val = evaluate(nodeId, cache, stack);
  const node = nodes.find(n => n.id === nodeId);
  if (!node) return null;

  if (node.type === 'pixelScript' && Array.isArray(val)) {
    const m = /^out(\d+)$/.exec(portName);
    if (m) {
      const idx = parseInt(m[1], 10) - 1;
      return val[idx] || null;
    }
  }
  return val;
}

/* =========================================================
   输出画布渲染
   ========================================================= */
function updateOutputCanvas(data, result) {
  const { canvas, ctx, containerEl, emptyMsg, badge, sizeTip, exportBtn } = data;
  const w = containerEl.clientWidth;
  const h = containerEl.clientHeight;
  if (w <= 0 || h <= 0) return;

  const pr = Math.min(window.devicePixelRatio * Math.max(scale, 0.7), 2.5);
  const cw = Math.round(w * pr);
  const ch = Math.round(h * pr);

  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (sizeTip) sizeTip.textContent = `${Math.round(w)} × ${Math.round(h)}`;

  if (!result || !result.width) {
    emptyMsg.style.display = 'flex';
    badge.textContent = '无输入';
    if (exportBtn) exportBtn.disabled = true;
    return;
  }
  emptyMsg.style.display = 'none';
  if (exportBtn) exportBtn.disabled = false;

  const s = Math.min(w / result.width, h / result.height);
  const dw = result.width  * s * pr;
  const dh = result.height * s * pr;
  const dx = (cw - dw) / 2;
  const dy = (ch - dh) / 2;

  ctx.imageSmoothingEnabled = s < 1;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(result, dx, dy, dw, dh);

  badge.textContent = `${result.width} × ${result.height}`;
}

function scheduleCanvasResolutionUpdate() {
  requestAnimationFrame(() => {
    for (const data of canvasNodeData.values()) {
      const w = data.containerEl.clientWidth;
      const h = data.containerEl.clientHeight;
      if (w > 0 && h > 0) updateOutputCanvas(data, data._lastResult);
    }
  });
}

/* =========================================================
   重建
   ========================================================= */
let pendingRebuild = false;
function scheduleRebuild() {
  if (pendingRebuild) return;
  pendingRebuild = true;
  requestAnimationFrame(() => {
    pendingRebuild = false;
    rebuild();
  });
}

function rebuild() {
  const cache = new Map();
  const visiting = new Set();

  for (const node of nodes) {
    evaluate(node.id, cache, visiting);
  }

  let portsChanged = false;
  for (const node of nodes) {
    if (node.type !== 'pixelScript') continue;
    const arr = cache.get(node.id);
    const count = Array.isArray(arr) ? arr.length : 0;
    const oldCount = node.outputCount || 0;
    if (count !== oldCount) {
      node.outputCount = count;
      edges = edges.filter(e => {
        if (e.from.node !== node.id) return true;
        const m = /^out(\d+)$/.exec(e.from.port);
        if (!m) return true;
        return parseInt(m[1], 10) <= count;
      });
      rebuildScriptPorts(node);
      portsChanged = true;
    }
  }

  for (const node of nodes) {
    if (node.type !== 'output') continue;
    const data = canvasNodeData.get(node.id);
    if (!data) continue;
    const result = cache.get(node.id);
    data._lastResult = result;
    updateOutputCanvas(data, result);
  }

  if (portsChanged) {
    requestAnimationFrame(() => {
      drawWires();
    });
  }
}

/* =========================================================
   端口缓存
   ========================================================= */
function clearPortCache(nodeId) {
  const el = nodeEls.get(nodeId);
  if (!el) return;
  el.querySelectorAll('.port').forEach(p => {
    p._ox = undefined;
    p._oy = undefined;
  });
}

/* =========================================================
   参数控件
   ========================================================= */
function fmt(v) {
  const n = parseFloat(v);
  if (Number.isInteger(n)) return String(n);
  return n.toFixed(2);
}

function createParamEl(node, p) {
  const wrap = document.createElement('div');
  wrap.className = 'param';

  const head = document.createElement('div');
  head.className = 'param-head';
  const lbl = document.createElement('span');
  lbl.textContent = p.label;
  head.appendChild(lbl);

  if (p.type === 'range') {
    const valInput = document.createElement('input');
    valInput.type = 'number';
    valInput.className = 'val-input';
    valInput.dataset.param = p.key;
    valInput.min = p.min; valInput.max = p.max; valInput.step = p.step;
    valInput.value = fmt(node.params[p.key]);
    valInput.title = '可直接输入';
    valInput.addEventListener('pointerdown', e => e.stopPropagation());

    const input = document.createElement('input');
    input.type = 'range';
    input.dataset.param = p.key;
    input.min = p.min; input.max = p.max; input.step = p.step;
    input.value = node.params[p.key];
    input.addEventListener('pointerdown', e => e.stopPropagation());
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      node.params[p.key] = v;
      valInput.value = fmt(v);
      scheduleRebuild();
    });
    valInput.addEventListener('change', () => {
      let v = parseFloat(valInput.value);
      if (isNaN(v)) v = p.value;
      v = clamp(v, p.min, p.max);
      node.params[p.key] = v;
      valInput.value = fmt(v);
      input.value = v;
      scheduleRebuild();
    });
    valInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') valInput.blur();
    });
    head.appendChild(valInput);
    wrap.append(head, input);
  }
  else if (p.type === 'color') {
    const input = document.createElement('input');
    input.type = 'color';
    input.value = node.params[p.key];
    input.addEventListener('pointerdown', e => e.stopPropagation());
    input.addEventListener('input', () => {
      node.params[p.key] = input.value;
      scheduleRebuild();
    });
    wrap.append(head, input);
  }
  else if (p.type === 'select') {
    const sel = document.createElement('select');
    sel.dataset.param = p.key;
    for (const [v, t] of p.options) {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      sel.appendChild(o);
    }
    sel.value = node.params[p.key];
    sel.addEventListener('pointerdown', e => e.stopPropagation());
    sel.addEventListener('change', () => {
      const oldVal = node.params[p.key];
      node.params[p.key] = sel.value;

      /* 卷积核大小变化 → 重建核网格 */
      if (node._kernelRefresh && p.key === 'ksize' && oldVal !== sel.value) {
        const oldSize = parseInt(oldVal, 10) || 3;
        const newSize = parseInt(sel.value, 10) || 3;
        node.params.kernel = resizeKernel(node.params.kernel, oldSize, newSize);
        const oldSum = oldSize * oldSize;
        const newSum = newSize * newSize;
        if (node.params.kdiv === oldSum) node.params.kdiv = newSum;

        const nodeEl = nodeEls.get(node.id);
        if (nodeEl) {
          const kdivSlider = nodeEl.querySelector('input[type=range][data-param="kdiv"]');
          const kdivNum = nodeEl.querySelector('input.val-input[data-param="kdiv"]');
          if (kdivSlider) kdivSlider.value = node.params.kdiv;
          if (kdivNum) kdivNum.value = fmt(node.params.kdiv);
        }

        node._kernelRefresh();
      }

      scheduleRebuild();
    });
    wrap.appendChild(sel);
  }
  else if (p.type === 'file') {
    wrap.appendChild(head);
    const row = document.createElement('div');
    row.className = 'file-row';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'file-btn';
    btn.textContent = node._fileName ? '更换图片' : '选择图片';

    const nameEl = document.createElement('span');
    nameEl.className = 'file-name';
    if (node._fileName) {
      nameEl.textContent = node._fileName.length > 16
        ? node._fileName.slice(0, 14) + '…' : node._fileName;
      nameEl.title = node._fileName;
      nameEl.classList.add('ok');
    } else {
      nameEl.textContent = '未选择';
    }

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.style.display = 'none';

    btn.addEventListener('pointerdown', e => e.stopPropagation());
    input.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', e => {
      e.stopPropagation();
      input.click();
    });

    input.addEventListener('change', e => {
      e.stopPropagation();
      const file = input.files && input.files[0];
      if (!file) return;
      nameEl.textContent = file.name;
      nameEl.title = file.name;
      nameEl.classList.remove('ok', 'err');

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const MAX = 1024;
        let w = img.naturalWidth, h = img.naturalHeight;
        const s = Math.min(1, MAX / Math.max(w, h));
        w = Math.max(1, Math.round(w * s));
        h = Math.max(1, Math.round(h * s));
        const c = newCanvas(w, h);
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        node._canvas = c;
        node._fileName = file.name;
        nameEl.textContent = file.name.length > 16
          ? file.name.slice(0, 14) + '…' : file.name;
        nameEl.title = file.name;
        nameEl.classList.add('ok');
        btn.textContent = '更换图片';
        URL.revokeObjectURL(url);
        scheduleRebuild();
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        nameEl.textContent = '加载失败';
        nameEl.classList.add('err');
      };
      img.src = url;
    });

    row.append(btn, nameEl, input);
    wrap.appendChild(row);
  }
  else if (p.type === 'code') {
    const codeEditor = createCodeEditor(node, p.key, () => {
      scheduleRebuild();
    });
    wrap.appendChild(codeEditor);
    wrap.style.padding = '4px 0 0';
    return wrap;
  }
  else if (p.type === 'kernel') {
    const grid = document.createElement('div');
    grid.className = 'kernel-grid';
    wrap.appendChild(grid);

    const presets = document.createElement('div');
    presets.className = 'kernel-presets';
    wrap.appendChild(presets);

    const renderGrid = () => {
      const size = parseInt(node.params.ksize, 10) || 3;
      const needed = size * size;

      if (!Array.isArray(node.params.kernel) || node.params.kernel.length !== needed) {
        node.params.kernel = makeMeanKernel(size);
      }
      const kernel = node.params.kernel;

      grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      grid.innerHTML = '';

      for (let i = 0; i < needed; i++) {
        const cell = document.createElement('input');
        cell.type = 'number';
        cell.className = 'kernel-cell';
        cell.step = '0.1';
        cell.value = fmtKernelNum(kernel[i]);
        cell.addEventListener('pointerdown', e => e.stopPropagation());
        cell.addEventListener('input', () => {
          const v = parseFloat(cell.value);
          kernel[i] = isNaN(v) ? 0 : v;
          scheduleRebuild();
        });
        cell.addEventListener('change', () => {
          const v = parseFloat(cell.value);
          kernel[i] = isNaN(v) ? 0 : v;
          cell.value = fmtKernelNum(kernel[i]);
        });
        grid.appendChild(cell);
      }
    };

    KERNEL_PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = preset.label;
      btn.addEventListener('pointerdown', e => e.stopPropagation());
      btn.addEventListener('click', e => {
        e.stopPropagation();
        node.params.ksize = String(preset.size);
        node.params.kernel = preset.kernel.slice();
        node.params.kdiv = preset.div;

        const nodeEl = nodeEls.get(node.id);
        if (nodeEl) {
          const ksizeSel = nodeEl.querySelector('select[data-param="ksize"]');
          if (ksizeSel) ksizeSel.value = String(preset.size);

          const kdivSlider = nodeEl.querySelector('input[type=range][data-param="kdiv"]');
          const kdivNum = nodeEl.querySelector('input.val-input[data-param="kdiv"]');
          if (kdivSlider) kdivSlider.value = preset.div;
          if (kdivNum) kdivNum.value = fmt(preset.div);
        }

        renderGrid();
        scheduleRebuild();
      });
      presets.appendChild(btn);
    });

    node._kernelRefresh = renderGrid;
    renderGrid();

    head.style.marginBottom = '2px';
  }

  return wrap;
}

/* =========================================================
   重建脚本节点的输入/输出端口
   ========================================================= */
function rebuildScriptPorts(node, el) {
  if (!el) el = nodeEls.get(node.id);
  if (!el) return;

  const inBox  = el.querySelector('.script-inputs');
  const outBox = el.querySelector('.script-outputs');
  if (!inBox || !outBox) return;

  const inputCount = node.inputCount || 1;
  const existingInputCount = inBox.querySelectorAll('.port-row.in').length;

  if (existingInputCount !== inputCount) {
    inBox.querySelectorAll('.port-row.in').forEach(r => r.remove());
    inBox.querySelectorAll('.port-controls').forEach(c => c.remove());

    for (let i = 1; i <= inputCount; i++) {
      const row = document.createElement('div');
      row.className = 'port-row in';
      row.innerHTML =
        `<div class="port in" data-node="${node.id}" data-port="img${i}" data-dir="in" data-type="img"></div>` +
        `<span class="plabel">图像 ${i}</span>`;
      inBox.appendChild(row);
    }

    const ctl = document.createElement('div');
    ctl.className = 'port-controls';

    const lbl = document.createElement('span');
    lbl.className = 'pc-label';
    lbl.textContent = '输入';

    const addBtn = document.createElement('button');
    addBtn.className = 'pc-btn';
    addBtn.type = 'button';
    addBtn.textContent = '+';
    addBtn.title = '添加图像输入';
    addBtn.disabled = inputCount >= SCRIPT_MAX_INPUTS;
    addBtn.addEventListener('pointerdown', e => e.stopPropagation());
    addBtn.addEventListener('click', e => {
      e.stopPropagation();
      node.inputCount = Math.min((node.inputCount || 1) + 1, SCRIPT_MAX_INPUTS);
      rebuildScriptPorts(node);
      drawWires();
      scheduleRebuild();
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'pc-btn';
    delBtn.type = 'button';
    delBtn.textContent = '−';
    delBtn.title = '移除图像输入';
    delBtn.disabled = inputCount <= 1;
    delBtn.addEventListener('pointerdown', e => e.stopPropagation());
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      const newCount = Math.max((node.inputCount || 1) - 1, 1);
      if (newCount === node.inputCount) return;
      for (let i = newCount + 1; i <= node.inputCount; i++) {
        const key = 'img' + i;
        edges = edges.filter(e2 => !(e2.to.node === node.id && e2.to.port === key));
      }
      node.inputCount = newCount;
      rebuildScriptPorts(node);
      drawWires();
      scheduleRebuild();
    });

    ctl.append(lbl, addBtn, delBtn);
    inBox.appendChild(ctl);

    clearPortCache(node.id);
  }

  const outputCount = node.outputCount || 0;
  const existingOutputCount = outBox.querySelectorAll('.port-row.out').length;
  const headerCount = outBox.querySelector('.script-out-header .count');
  const headerVal = headerCount ? parseInt(headerCount.textContent, 10) : -1;

  if (existingOutputCount !== outputCount || headerVal !== outputCount) {
    outBox.innerHTML = '';

    const outHeader = document.createElement('div');
    outHeader.className = 'script-out-header';
    outHeader.innerHTML = `输出 <span class="count">${outputCount}</span>`;
    outBox.appendChild(outHeader);

    if (outputCount === 0) {
      const empty = document.createElement('div');
      empty.className = 'script-out-empty';
      empty.textContent = '脚本未返回图像';
      outBox.appendChild(empty);
    } else {
      for (let i = 1; i <= outputCount; i++) {
        const row = document.createElement('div');
        row.className = 'port-row out';
        row.innerHTML =
          `<span class="plabel">输出 ${i}</span>` +
          `<div class="port out" data-node="${node.id}" data-port="out${i}" data-dir="out" data-type="img"></div>`;
        outBox.appendChild(row);
      }
    }

    clearPortCache(node.id);
  }
}

/* =========================================================
   创建节点元素
   ========================================================= */
function createNodeEl(node) {
  const def = DEFS[node.type];
  const cat = CATS[def.cat];
  const isScript = node.type === 'pixelScript';
  const isCodeNode = def.params.some(p => p.type === 'code');
  const isConvolve = node.type === 'convolve';

  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = node.id;
  el.dataset.cat = def.cat;
  el.style.setProperty('--c', cat.color);

  if (isCodeNode) el.style.width = '290px';
  if (isConvolve) el.style.width = '240px';

  const head = document.createElement('div');
  head.className = 'node-head';
  head.title = '双击复制节点';

  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.textContent = def.icon;

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = def.label;

  const closeBtn = document.createElement('button');
  closeBtn.className = 'close';
  closeBtn.textContent = '✕';
  closeBtn.title = '删除节点';
  closeBtn.addEventListener('pointerdown', e => e.stopPropagation());
  closeBtn.addEventListener('click', e => {
    e.stopPropagation();
    deleteNode(node.id);
  });

  head.append(ico, name, closeBtn);
  head.addEventListener('dblclick', e => {
    e.stopPropagation();
    duplicateNode(node);
  });

  el.appendChild(head);

  const body = document.createElement('div');
  body.className = 'node-body';
  el.appendChild(body);

  if (isScript) {
    const inBox = document.createElement('div');
    inBox.className = 'script-inputs';
    body.appendChild(inBox);
  } else {
    def.inputs.forEach(inp => {
      const row = document.createElement('div');
      row.className = 'port-row in';
      const port = document.createElement('div');
      port.className = 'port in';
      port.dataset.node = node.id;
      port.dataset.port = inp.name;
      port.dataset.dir = 'in';
      port.dataset.type = inp.type;
      const lbl = document.createElement('span');
      lbl.className = 'plabel';
      lbl.textContent = inp.label;
      row.append(port, lbl);
      body.appendChild(row);
    });
  }

  def.params.forEach(p => body.appendChild(createParamEl(node, p)));

  if (node.type === 'output') {
    const box = document.createElement('div');
    box.className = 'node-canvas';
    box.style.width  = node.canvasW + 'px';
    box.style.height = node.canvasH + 'px';

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    box.appendChild(canvas);

    const emptyMsg = document.createElement('div');
    emptyMsg.className = 'empty-msg';
    emptyMsg.innerHTML = '<div class="big">▢</div><div>连接图像</div>';
    box.appendChild(emptyMsg);

    const badge = document.createElement('div');
    badge.className = 'stats-badge';
    badge.textContent = '无输入';
    box.appendChild(badge);

    const sizeTip = document.createElement('div');
    sizeTip.className = 'size-tip';
    sizeTip.textContent = `${node.canvasW} × ${node.canvasH}`;
    box.appendChild(sizeTip);

    /* 导出按钮 */
    const exportBtn = document.createElement('button');
    exportBtn.className = 'export-btn';
    exportBtn.title = '导出此图像';
    exportBtn.setAttribute('aria-label', '导出此图像');
    exportBtn.disabled = true;
    exportBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    `;
    exportBtn.addEventListener('pointerdown', e => e.stopPropagation());
    exportBtn.addEventListener('click', e => {
      e.stopPropagation();
      exportNodeOutput(node.id);
    });
    box.appendChild(exportBtn);

    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    handle.title = '拖拽调整画布尺寸';
    box.appendChild(handle);

    handle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      e.preventDefault();
      try { handle.setPointerCapture(e.pointerId); } catch(err) {}

      const startW = node.canvasW;
      const startH = node.canvasH;
      const startX = e.clientX;
      const startY = e.clientY;
      const sc = scale;

      const onMove = ev => {
        const dw = (ev.clientX - startX) / sc;
        const dh = (ev.clientY - startY) / sc;
        node.canvasW = Math.round(clamp(startW + dw, CANVAS_MIN_W, CANVAS_MAX_W));
        node.canvasH = Math.round(clamp(startH + dh, CANVAS_MIN_H, CANVAS_MAX_H));
        applyOutputSize(node, el, box);
        const d = canvasNodeData.get(node.id);
        if (d) updateOutputCanvas(d, d._lastResult);
        drawWires();
      };
      const onUp = ev => {
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        try { handle.releasePointerCapture(ev.pointerId); } catch(err) {}
      };
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });

    body.appendChild(box);

    el.style.width = (node.canvasW + 22) + 'px';

    canvasNodeData.set(node.id, {
      nodeId: node.id,
      containerEl: box,
      canvas, ctx,
      emptyMsg, badge, sizeTip,
      exportBtn,
      _lastResult: null,
      ro: null,
    });
  }

  if (isScript) {
    const outBox = document.createElement('div');
    outBox.className = 'script-outputs';
    body.appendChild(outBox);
    rebuildScriptPorts(node, el);
  } else {
    def.outputs.forEach(outp => {
      const row = document.createElement('div');
      row.className = 'port-row out';
      const lbl = document.createElement('span');
      lbl.className = 'plabel';
      lbl.textContent = outp.label;
      const port = document.createElement('div');
      port.className = 'port out';
      port.dataset.node = node.id;
      port.dataset.port = outp.name;
      port.dataset.dir = 'out';
      port.dataset.type = outp.type;
      row.append(lbl, port);
      body.appendChild(row);
    });
  }

  return el;
}

function applyOutputSize(node, el, box) {
  box.style.width  = node.canvasW + 'px';
  box.style.height = node.canvasH + 'px';
  el.style.width = (node.canvasW + 22) + 'px';
  clearPortCache(node.id);
}

function disposeCanvasData(id) {
  const data = canvasNodeData.get(id);
  if (!data) return;
  try { if (data.ro) data.ro.disconnect(); } catch(e){}
  canvasNodeData.delete(id);
}

function initCanvasObservers() {
  for (const [id, data] of canvasNodeData) {
    if (data.ro) continue;
    try {
      const ro = new ResizeObserver(() => {
        updateOutputCanvas(data, data._lastResult);
      });
      ro.observe(data.containerEl);
      data.ro = ro;
    } catch(e){}
  }
}

/* =========================================================
   同步节点元素
   ========================================================= */
function syncNodes() {
  for (const [id, el] of [...nodeEls.entries()]) {
    if (!nodes.find(n => n.id === id)) {
      disposeCanvasData(id);
      el.remove();
      nodeEls.delete(id);
    }
  }
  for (const node of nodes) {
    let el = nodeEls.get(node.id);
    if (!el) {
      el = createNodeEl(node);
      nodeEls.set(node.id, el);
      nodesLayer.appendChild(el);
    }
    el.style.transform = `translate(${node.x}px, ${node.y}px)`;
  }
  drawWires();
}

/* =========================================================
   端口位置
   ========================================================= */
const SVG_OFFSET = 20000;

function measurePortOffset(nodeEl, portEl) {
  const nr = nodeEl.getBoundingClientRect();
  const pr = portEl.getBoundingClientRect();
  const ow = nodeEl.offsetWidth;
  if (nr.width <= 0 || pr.width <= 0 || ow <= 0) return null;
  const s = nr.width / ow;
  if (!isFinite(s) || s <= 0) return null;
  return {
    x: (pr.left + pr.width / 2 - nr.left) / s,
    y: (pr.top + pr.height / 2 - nr.top) / s,
  };
}

function portPos(nodeId, portName, dir) {
  const node = nodes.find(n => n.id === nodeId);
  if (!node) return null;
  const nodeEl = nodeEls.get(nodeId);
  if (!nodeEl) return null;
  const portEl = nodeEl.querySelector(`.port[data-port="${portName}"][data-dir="${dir}"]`);
  if (!portEl) return null;

  if (portEl._ox === undefined || portEl._oy === undefined) {
    const m = measurePortOffset(nodeEl, portEl);
    if (!m) return null;
    portEl._ox = m.x;
    portEl._oy = m.y;
  }
  return {
    x: node.x + portEl._ox + SVG_OFFSET,
    y: node.y + portEl._oy + SVG_OFFSET,
  };
}

function edgeColor(edge) {
  const n = nodes.find(x => x.id === edge.from.node);
  if (!n) return '#5b92dd';
  return CATS[DEFS[n.type].cat].color;
}

let tempLink = null;

/* =========================================================
   连线绘制
   ========================================================= */
const wireGroups = new Map();
let tempWireEl = null;

function makePath(cls, stroke) {
  const p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('class', cls);
  if (stroke) p.setAttribute('stroke', stroke);
  return p;
}

function computePath(a, b) {
  const dx = Math.max(36, Math.abs(b.x - a.x) * 0.46);
  return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
}

function drawWires() {
  const seen = new Set();

  for (const e of edges) {
    seen.add(e.id);

    let g = wireGroups.get(e.id);
    if (!g) {
      g = document.createElementNS(SVG_NS, 'g');
      const hit  = makePath('wire-hit');
      const glow = makePath('wire-glow');
      const core = makePath('wire-core');
      g.appendChild(hit);
      g.appendChild(glow);
      g.appendChild(core);
      g._hit = hit; g._glow = glow; g._core = core;
      hit.addEventListener('pointerdown', ev => {
        ev.stopPropagation();
        deleteEdgeById(e.id);
      });
      wireGroups.set(e.id, g);
      wiresEl.appendChild(g);
    }

    const a = portPos(e.from.node, e.from.port, 'out');
    const b = portPos(e.to.node, e.to.port, 'in');
    if (!a || !b) { g.style.display = 'none'; continue; }
    g.style.display = '';

    const c = edgeColor(e);
    const d = computePath(a, b);
    g._hit.setAttribute('d', d);
    g._glow.setAttribute('d', d);
    g._glow.setAttribute('stroke', c);
    g._core.setAttribute('d', d);
    g._core.setAttribute('stroke', c);
  }

  for (const [id, g] of [...wireGroups]) {
    if (!seen.has(id)) { g.remove(); wireGroups.delete(id); }
  }

  if (tempLink) {
    if (!tempWireEl) {
      const g = document.createElementNS(SVG_NS, 'g');
      const p = makePath('wire-temp');
      g.appendChild(p);
      g._p = p;
      tempWireEl = g;
      wiresEl.appendChild(g);
    }
    tempWireEl._p.setAttribute('d', computePath(tempLink.from, tempLink.to));
    tempWireEl._p.setAttribute('stroke', tempLink.color);
  } else if (tempWireEl) {
    tempWireEl.remove();
    tempWireEl = null;
  }
}

function deleteEdgeById(id) {
  const idx = edges.findIndex(e => e.id === id);
  if (idx < 0) return;
  edges.splice(idx, 1);
  drawWires();
  scheduleRebuild();
}

/* =========================================================
   视图变换
   ========================================================= */
function applyTransform() {
  worldEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  const gs = 22 * scale;
  editorEl.style.backgroundSize = `${gs}px ${gs}px, ${gs}px ${gs}px`;
  editorEl.style.backgroundPosition = `${panX}px ${panY}px, ${panX}px ${panY}px`;
  scheduleCanvasResolutionUpdate();
  drawWires();
}

function zoomAt(factor, cx, cy) {
  const ns = clamp(scale * factor, 0.25, 2.6);
  if (ns === scale) return;
  const wx = (cx - panX) / scale;
  const wy = (cy - panY) / scale;
  scale = ns;
  panX = cx - wx * ns;
  panY = cy - wy * ns;
  applyTransform();
}

/* =========================================================
   指针交互
   ========================================================= */
const pointers = new Map();
let gesture = null;

function isFormEl(t) {
  if (!t) return false;
  const tag = t.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON';
}

function onPointerDown(e) {
  if (e.target.closest('.param')) return;
  if (e.target.closest('.code-block')) return;
  if (e.target.closest('.kernel-grid')) return;
  if (e.target.closest('.kernel-presets')) return;
  if (e.target.closest('.zoomctl')) return;
  if (e.target.closest('.fab')) return;
  if (e.target.closest('.palette')) return;
  if (e.target.closest('.node-head .close')) return;
  if (e.target.closest('.resize-handle')) return;
  if (e.target.closest('.port-controls')) return;
  if (e.target.closest('.export-btn')) return;

  const wireHit = e.target.closest('.wire-hit');
  if (wireHit) { e.stopPropagation(); return; }

  editorEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    if (gesture && gesture.type === 'node' && gesture.el) {
      gesture.el.classList.remove('dragging');
    }
    const [a, b] = [...pointers.values()];
    const eRect = editorEl.getBoundingClientRect();
    gesture = {
      type: 'pinch',
      dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      cx: (a.x + b.x) / 2 - eRect.left,
      cy: (a.y + b.y) / 2 - eRect.top,
      panX0: panX, panY0: panY, scale0: scale,
    };
    tempLink = null;
    drawWires();
    return;
  }
  if (pointers.size > 2) return;

  const portEl = e.target.closest('.port');
  if (portEl) {
    const dir = portEl.dataset.dir;
    const from = portPos(portEl.dataset.node, portEl.dataset.port, dir);
    if (from) {
      gesture = {
        type: 'link',
        pointerId: e.pointerId,
        from,
        origin: {
          node: portEl.dataset.node,
          port: portEl.dataset.port,
          dir,
          type: portEl.dataset.type,
        },
      };
      const n = nodes.find(n => n.id === portEl.dataset.node);
      const c = n ? CATS[DEFS[n.type].cat].color : '#5b92dd';
      tempLink = { from, to: { ...from }, color: c };
      highlightPorts(portEl.dataset.type, dir);
      drawWires();
    }
    return;
  }

  const headEl = e.target.closest('.node-head');
  const nodeEl = e.target.closest('.node');
  if (headEl && nodeEl) {
    const node = nodes.find(n => n.id === nodeEl.dataset.id);
    if (!node) return;
    nodesLayer.appendChild(nodeEl);
    const eRect = editorEl.getBoundingClientRect();
    gesture = {
      type: 'node',
      pointerId: e.pointerId,
      node, el: nodeEl,
      ox: (e.clientX - eRect.left - panX) / scale - node.x,
      oy: (e.clientY - eRect.top - panY) / scale - node.y,
    };
    nodeEl.classList.add('dragging');
    return;
  }

  if (nodeEl) return;

  gesture = {
    type: 'pan',
    pointerId: e.pointerId,
    sx: e.clientX, sy: e.clientY,
    px: panX, py: panY,
  };
  editorEl.classList.add('panning');
  hideHint();
}

function onPointerMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (gesture?.type === 'pinch') {
    if (pointers.size < 2) return;
    const [a, b] = [...pointers.values()];
    const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const eRect = editorEl.getBoundingClientRect();
    const cx = (a.x + b.x) / 2 - eRect.left;
    const cy = (a.y + b.y) / 2 - eRect.top;
    const ns = clamp(gesture.scale0 * (dist / gesture.dist), 0.25, 2.6);
    const wx = (gesture.cx - gesture.panX0) / gesture.scale0;
    const wy = (gesture.cy - gesture.panY0) / gesture.scale0;
    scale = ns;
    panX = cx - wx * ns;
    panY = cy - wy * ns;
    applyTransform();
    return;
  }

  if (!gesture || gesture.pointerId !== e.pointerId) return;
  const eRect = editorEl.getBoundingClientRect();

  if (gesture.type === 'pan') {
    panX = gesture.px + (e.clientX - gesture.sx);
    panY = gesture.py + (e.clientY - gesture.sy);
    applyTransform();
  }
  else if (gesture.type === 'node') {
    gesture.node.x = (e.clientX - eRect.left - panX) / scale - gesture.ox;
    gesture.node.y = (e.clientY - eRect.top - panY) / scale - gesture.oy;
    gesture.el.style.transform = `translate(${gesture.node.x}px, ${gesture.node.y}px)`;
    drawWires();
  }
  else if (gesture.type === 'link' && tempLink) {
    tempLink.to = {
      x: (e.clientX - eRect.left - panX) / scale + SVG_OFFSET,
      y: (e.clientY - eRect.top - panY) / scale + SVG_OFFSET,
    };
    drawWires();
  }
}

function onPointerUp(e) {
  pointers.delete(e.pointerId);

  if (gesture?.type === 'pinch') {
    if (pointers.size < 2) gesture = null;
    return;
  }
  if (!gesture || gesture.pointerId !== e.pointerId) {
    if (pointers.size === 0) gesture = null;
    return;
  }

  if (gesture.type === 'link') {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const portEl = el && el.closest ? el.closest('.port') : null;
    if (portEl) tryConnect(gesture.origin, portEl);
    tempLink = null;
    clearPortHighlight();
    drawWires();
  }
  else if (gesture.type === 'node') {
    gesture.el.classList.remove('dragging');
  }
  else if (gesture.type === 'pan') {
    editorEl.classList.remove('panning');
  }

  gesture = null;
}

editorEl.addEventListener('pointerdown', onPointerDown);
editorEl.addEventListener('pointermove', onPointerMove);
editorEl.addEventListener('pointerup', onPointerUp);
editorEl.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  if (gesture?.type === 'node' && gesture.el) gesture.el.classList.remove('dragging');
  if (gesture?.type === 'pinch' && pointers.size < 2) gesture = null;
  else if (gesture && gesture.type !== 'pinch') gesture = null;
  tempLink = null;
  editorEl.classList.remove('panning');
  clearPortHighlight();
  drawWires();
});

function highlightPorts(type, dir) {
  nodesLayer.querySelectorAll('.port').forEach(p => {
    const ok = p.dataset.type === type && p.dataset.dir !== dir;
    if (!ok) p.classList.add('invalid');
  });
}
function clearPortHighlight() {
  nodesLayer.querySelectorAll('.port.invalid').forEach(p => p.classList.remove('invalid'));
}

function wouldCycle(fromNode, toNode) {
  const stack = [toNode];
  const seen = new Set();
  while (stack.length) {
    const cur = stack.pop();
    if (cur === fromNode) return true;
    if (seen.has(cur)) continue;
    seen.add(cur);
    edges.forEach(e => { if (e.from.node === cur) stack.push(e.to.node); });
  }
  return false;
}

function tryConnect(origin, portEl) {
  const target = {
    node: portEl.dataset.node,
    port: portEl.dataset.port,
    dir: portEl.dataset.dir,
    type: portEl.dataset.type,
  };

  if (origin.dir === target.dir) return;
  if (origin.node === target.node) return;
  if (origin.type !== target.type) return;

  let a = origin, b = target;
  if (a.dir === 'in') { a = target; b = origin; }

  if (wouldCycle(a.node, b.node)) return;

  edges = edges.filter(e => !(e.to.node === b.node && e.to.port === b.port));
  edges.push({
    id: 'e' + (uid++),
    from: { node: a.node, port: a.port },
    to:   { node: b.node, port: b.port },
  });

  drawWires();
  scheduleRebuild();
}

editorEl.addEventListener('wheel', e => {
  if (isFormEl(e.target)) return;
  e.preventDefault();
  const rect = editorEl.getBoundingClientRect();
  const factor = Math.exp(-e.deltaY * 0.0016);
  zoomAt(factor, e.clientX - rect.left, e.clientY - rect.top);
  hideHint();
}, { passive: false });

/* =========================================================
   节点增删 / 复制
   ========================================================= */
function addNode(type, x, y, overrides) {
  const def = DEFS[type];
  const params = {};
  def.params.forEach(p => {
    if (p.type === 'file') return;
    if (p.type === 'kernel') return;
    params[p.key] = p.value;
  });
  if (overrides) Object.assign(params, overrides);

  if (type === 'convolve') {
    const size = parseInt(params.ksize, 10) || 3;
    params.kernel = makeMeanKernel(size);
    if (params.kdiv === undefined) params.kdiv = size * size;
  }

  const node = { id: 'n' + (uid++), type, x, y, params };

  if (type === 'output') {
    node.canvasW = CANVAS_DEF_W;
    node.canvasH = CANVAS_DEF_H;
  }
  if (type === 'pixelScript') {
    node.inputCount = 1;
    node.outputCount = 0;
  }

  nodes.push(node);
  syncNodes();
  initCanvasObservers();
  scheduleRebuild();
  return node;
}

function duplicateNode(node) {
  const copy = {
    id: 'n' + (uid++),
    type: node.type,
    x: node.x + 28,
    y: node.y + 28,
    params: JSON.parse(JSON.stringify(node.params)),
  };
  if (node._canvas) copy._canvas = node._canvas;
  if (node._fileName) copy._fileName = node._fileName;
  if (node.type === 'output') {
    copy.canvasW = node.canvasW;
    copy.canvasH = node.canvasH;
  }
  if (node.type === 'pixelScript') {
    copy.inputCount = node.inputCount || 1;
    copy.outputCount = 0;
  }

  nodes.push(copy);
  syncNodes();
  initCanvasObservers();
  scheduleRebuild();
  return copy;
}

function deleteNode(id) {
  nodes = nodes.filter(n => n.id !== id);
  edges = edges.filter(e => e.from.node !== id && e.to.node !== id);
  disposeCanvasData(id);
  pendingErrors.delete(id);
  const el = nodeEls.get(id);
  if (el) { el.remove(); nodeEls.delete(id); }
  drawWires();
  scheduleRebuild();
}

/* =========================================================
   视图适配
   ========================================================= */
function fitView() {
  if (!nodes.length) {
    panX = 60; panY = 60; scale = 1;
    applyTransform();
    return;
  }
  const rect = editorEl.getBoundingClientRect();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  nodes.forEach(n => {
    const el = nodeEls.get(n.id);
    const w = el ? el.offsetWidth : 204;
    const h = el ? el.offsetHeight : 200;
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + w);
    maxY = Math.max(maxY, n.y + h);
  });

  const pad = 56;
  const gw = (maxX - minX) + pad * 2;
  const gh = (maxY - minY) + pad * 2;
  const s = clamp(Math.min(rect.width / gw, rect.height / gh), 0.3, 1.15);

  scale = s;
  panX = (rect.width  - (maxX - minX) * s) / 2 - minX * s;
  panY = (rect.height - (maxY - minY) * s) / 2 - minY * s;
  applyTransform();
}

/* =========================================================
   调色板
   ========================================================= */
function buildPalette() {
  const groups = {
    source:    palette.querySelector('[data-cat="source"] .pal-grid'),
    filter:    palette.querySelector('[data-cat="filter"] .pal-grid'),
    transform: palette.querySelector('[data-cat="transform"] .pal-grid'),
    output:    palette.querySelector('[data-cat="output"] .pal-grid'),
  };

  Object.entries(DEFS).forEach(([key, def]) => {
    const grid = groups[def.cat];
    if (!grid) return;

    const btn = document.createElement('button');
    btn.className = 'pal-item';
    btn.style.setProperty('--pc', CATS[def.cat].color);

    const pi = document.createElement('span');
    pi.className = 'pi';
    pi.textContent = def.icon;
    const tx = document.createElement('span');
    tx.textContent = def.label;
    btn.append(pi, tx);

    btn.addEventListener('click', () => {
      const rect = editorEl.getBoundingClientRect();
      const cx = (rect.width / 2 - panX) / scale - 120;
      const cy = (rect.height / 2 - panY) / scale - 90;
      const jitter = () => (Math.random() - 0.5) * 100;
      addNode(key, cx + jitter(), cy + jitter());
      syncNodes();
      drawWires();
      scheduleRebuild();
      closePalette();
      hideHint();
    });
    grid.appendChild(btn);
  });
}

function openPalette() {
  palette.classList.remove('hidden');
  fabAdd.classList.add('open');
}
function closePalette() {
  palette.classList.add('hidden');
  fabAdd.classList.remove('open');
}
function togglePalette() {
  if (palette.classList.contains('hidden')) openPalette();
  else closePalette();
}

fabAdd.addEventListener('click', e => { e.stopPropagation(); togglePalette(); });
$('btnAdd').addEventListener('click', e => { e.stopPropagation(); togglePalette(); });

document.addEventListener('pointerdown', e => {
  if (palette.classList.contains('hidden')) return;
  if (e.target.closest('.palette') || e.target.closest('.fab') || e.target.closest('#btnAdd')) return;
  closePalette();
});

/* =========================================================
   提示
   ========================================================= */
let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  hintEl.classList.add('hide');
}
setTimeout(hideHint, 12000);

/* =========================================================
   缩放按钮
   ========================================================= */
$('zoomIn').addEventListener('click', () => {
  const r = editorEl.getBoundingClientRect();
  zoomAt(1.22, r.width / 2, r.height / 2);
});
$('zoomOut').addEventListener('click', () => {
  const r = editorEl.getBoundingClientRect();
  zoomAt(1 / 1.22, r.width / 2, r.height / 2);
});
$('zoomFit').addEventListener('click', () => fitView());

/* =========================================================
   示例图
   ========================================================= */
function makeDemoImage() {
  const S = 400;
  const c = newCanvas(S, S);
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#ff7a45');
  g.addColorStop(0.5, '#ff4d6d');
  g.addColorStop(1, '#3a7bd5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  for (let i = 0; i < 6; i++) {
    const x = 60 + Math.random() * (S - 120);
    const y = 60 + Math.random() * (S - 120);
    const r = 40 + Math.random() * 60;
    const rad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
    rad2.addColorStop(0, `hsla(${Math.random() * 360},95%,70%,.5)`);
    rad2.addColorStop(1, 'hsla(0,0%,100%,0)');
    ctx.fillStyle = rad2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, 55, 0, Math.PI * 2);
  ctx.stroke();

  return c;
}

/* =========================================================
   示例场景（像素脚本版）
   ========================================================= */
function resetGraph() {
  for (const id of [...canvasNodeData.keys()]) disposeCanvasData(id);
  wireGroups.forEach(g => g.remove());
  wireGroups.clear();
  if (tempWireEl) { tempWireEl.remove(); tempWireEl = null; }
  nodesLayer.innerHTML = '';
  nodeEls.clear();
  nodes = [];
  edges = [];
  uid = 0;
  pendingErrors.clear();
  closePalette();

  const img = addNode('image', 40, 80);
  img._canvas = makeDemoImage();
  img._fileName = 'demo.png';
  const fileBtn = nodeEls.get(img.id)?.querySelector('.file-btn');
  const fileName = nodeEls.get(img.id)?.querySelector('.file-name');
  if (fileBtn) fileBtn.textContent = '更换图片';
  if (fileName) {
    fileName.textContent = 'demo.png';
    fileName.title = 'demo.png';
    fileName.classList.add('ok');
  }

  const script = addNode('pixelScript', 320, 80);

  const out = addNode('output', 720, 80);
  out.canvasW = 240;
  out.canvasH = 180;
  const outEl = nodeEls.get(out.id);
  if (outEl) {
    const outBox = outEl.querySelector('.node-canvas');
    if (outBox) applyOutputSize(out, outEl, outBox);
  }

  edges.push({ id: 'e' + (uid++), from: { node: img.id,    port: 'out' }, to: { node: script.id, port: 'img1' } });
  edges.push({ id: 'e' + (uid++), from: { node: script.id, port: 'out1' }, to: { node: out.id,  port: 'in' } });

  syncNodes();
  initCanvasObservers();
  drawWires();

  requestAnimationFrame(() => {
    fitView();
    rebuild();
    setTimeout(() => {
      for (const data of canvasNodeData.values()) {
        updateOutputCanvas(data, data._lastResult);
      }
      drawWires();
    }, 80);
  });
}

$('btnDemo').addEventListener('click', resetGraph);

/* =========================================================
   键盘
   ========================================================= */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'f' || e.key === 'F') fitView();
  if (e.key === 'n' || e.key === 'N') togglePalette();
});

/* =========================================================
   启动
   ========================================================= */
buildPalette();
resetGraph();

window.addEventListener('resize', () => { drawWires(); });

setTimeout(() => {
  drawWires();
  rebuild();
}, 300);
</script>
